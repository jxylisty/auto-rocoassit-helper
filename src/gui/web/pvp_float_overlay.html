<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PVP 对决实时推演</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="assets/pet_asset_map.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* ============ 魔法绘本皮肤 V4.5 (换肤不换骨: DOM/JS 合约原样) ============ */
    :root {
        --paper: #f6efdc;          /* 书页黄 */
        --card-bg: rgba(252, 247, 234, 0.97);
        --card-edge: #c8b482;      /* 金棕描边 */
        --line: #dccfa8;
        --ink-1: #3f3428;          /* 棕墨主字 */
        --ink-2: #655741;
        --ink-3: #8a7a5e;
        --gold: #8a6420;           /* 鎏金强调 */
        --gold-soft: rgba(138, 100, 32, 0.12);
        --cover: #332a1d;          /* 书脊深棕 */
        --foil: #e6c46a;
        --leaf: #4f7a4a;           /* 叶绿 = 正常/成功 */
        --wax: #a8402f;            /* 火漆红 = 战斗/危险 */
        --wax-soft: rgba(168, 64, 47, 0.12);
        --teal: #3d6b5c;
        --num-font: Consolas, 'Cascadia Mono', monospace;
        --text: #3f3428;          /* 主文字 */
        --bg: rgba(252, 247, 234, 0.97);    /* 卡片背景 */
        --border: #dccfa8;         /* 边框 */
        --radius: 12px;            /* 圆角 */
        --dim: #8a7a5e;            /* 暗色文字 */
        --accent: #8a6420;         /* 强调色 */
        --ok: #4f7a4a;             /* 成功/正常 */
        --warn: #b07d1e;           /* 警告 */
        --err: #a8402f;            /* 错误 */
    }
html, body {
    background: transparent;
    width: 100%; height: 100%;
    overflow: hidden;
}
body {
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    color: var(--text); user-select: none; font-size: 12px;
    -webkit-font-smoothing: antialiased;
}
.card {
    width: 100%;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
    overflow: hidden;
    transition: box-shadow 0.3s ease;
}
.card:hover {
    box-shadow: 0 12px 48px rgba(0,0,0,0.75), 0 0 0 1px rgba(99, 102, 241, 0.3);
}

/* 顶部拖拽栏 */
.head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(99, 102, 241, 0.08), rgba(255, 255, 255, 0.02));
    cursor: move;
    height: 42px;
}
.head .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; flex-shrink: 0; }
.head .dot.off { background: #64748b; box-shadow: none; }
.head .title { font-size: 13px; font-weight: 700; flex: 1; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
.head .title .badge { font-size: 9.5px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
.head .speed-badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
}
.head .speed-badge.fast { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.4); color: #4ade80; }
.head .speed-badge.slow { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #f87171; }

.fold-btn {
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
    color: var(--dim); width: 24px; height: 24px;
    border-radius: 6px; cursor: pointer; font-size: 11px;
    line-height: 1; display: flex; align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}
.fold-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(99, 102, 241, 0.2); }

/* 主体容器: 高度跟随内容(紧凑卡常显 + 详情默认折叠), 窗口尺寸由外壳
   syncSize 按卡片实际高度自适应, 不再用 490px 内滚死限制挤压推演区块 */
.body {
    padding: 10px 12px 14px;
}

/* 对阵双方 VS 看板 */
.vs-banner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    padding: 10px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(239, 68, 68, 0.1));
    border: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 8px;
}
.pet-side {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.pet-side.enemy {
    align-items: flex-end;
    text-align: right;
}
.pet-header {
    display: flex;
    align-items: center;
    gap: 8px;
}
.pet-side.enemy .pet-header {
    flex-direction: row-reverse;
}
.pet-avatar {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.4);
    border: 1.5px solid rgba(59, 130, 246, 0.5);
    object-fit: cover;
    flex-shrink: 0;
}
.pet-side.enemy .pet-avatar {
    border-color: rgba(239, 68, 68, 0.5);
}
.pet-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
}
.pet-name {
    font-size: 13px; font-weight: 700;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 4px;
}
.pet-attrs {
    display: flex; align-items: center; gap: 3px; margin-top: 2px;
}
.pet-side.enemy .pet-attrs {
    justify-content: flex-end;
}
.attr-badge-img {
    width: 15px; height: 15px; object-fit: contain;
}

.vs-divider {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.vs-tag {
    font-size: 12px; font-weight: 900; font-style: italic;
    background: linear-gradient(135deg, #60a5fa, #f87171);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

/* 血条与能量 */
.stat-bar-box {
    width: 100%;
    margin-top: 4px;
}
.stat-nums {
    display: flex; justify-content: space-between; font-size: 10.5px; margin-bottom: 2px; font-variant-numeric: tabular-nums;
}
.stat-nums .hp-val { font-weight: 700; }
.bar-track { height: 6px; border-radius: 999px; overflow: hidden; background: linear-gradient(90deg, #22c55e, #eab308 55%, #ef4444); }
.bar-fill { height: 100%; border-radius: 0 999px 999px 0; margin-left: auto; background: rgba(8, 12, 22, 0.82); transition: width 0.45s ease; }
.energy-row {
    display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); margin-top: 2px;
}
.energy-crystals {
    color: #38bdf8; font-weight: 700; font-size: 12px;
}

/* 小标题 */
.sec-title {
    font-size: 11px; font-weight: 700; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 8px 0 5px; display: flex; align-items: center; gap: 5px;
}

/* 技能与推演列表 */
.skills-grid {
    display: flex; flex-direction: column; gap: 5px;
}
.skill-card {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    transition: all 0.2s ease;
}
.skill-card:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(99, 102, 241, 0.3);
}
.skill-card.kill {
    background: linear-gradient(90deg, rgba(239, 68, 68, 0.12), rgba(245, 158, 11, 0.08));
    border-color: rgba(239, 68, 68, 0.45);
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
    animation: killGlow 1.8s infinite;
}
@keyframes killGlow {
    0%,100% { border-color: rgba(239, 68, 68, 0.45); box-shadow: 0 0 10px rgba(239, 68, 68, 0.15); }
    50% { border-color: rgba(239, 68, 68, 0.85); box-shadow: 0 0 18px rgba(239, 68, 68, 0.35); }
}

.skill-icon {
    width: 26px; height: 26px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
    object-fit: cover; flex-shrink: 0;
}
.skill-main {
    flex: 1; min-width: 0;
}
.skill-name-row {
    display: flex; align-items: center; gap: 5px;
}
.skill-name {
    font-size: 12px; font-weight: 700; color: var(--text);
}
.skill-type-tag {
    font-size: 9.5px; padding: 1px 5px; border-radius: 4px;
    background: rgba(255, 255, 255, 0.06); color: var(--dim);
}
.skill-dmg-box {
    text-align: right;
    display: flex; flex-direction: column; align-items: flex-end;
}
.skill-dmg-num {
    font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: #38bdf8;
}
.skill-dmg-num.kill {
    color: #f87171; font-size: 12.5px;
}
.skill-mult {
    font-size: 9.5px; color: #4ade80; font-weight: 600;
}
.kill-tag {
    font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 3px;
    background: #ef4444; color: #fff; margin-top: 1px;
}
/* 动态威力档位标签(鸣沙陷阱/闪击) */
.skill-dyn-tag {
    font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
    background: rgba(56, 189, 248, 0.18); color: #38bdf8;
}
/* 星陨印记引爆速查 */
.starfall-box {
    margin-top: 8px; padding: 8px 10px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(59, 130, 246, 0.06));
    border: 1px solid rgba(139, 92, 246, 0.3);
}
.starfall-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
}
.starfall-title {
    font-size: 12px; font-weight: 700; color: #c4b5fd; display: flex; align-items: center; gap: 5px;
}
.starfall-select {
    font-size: 11px; padding: 2px 6px; border-radius: 6px;
    background: rgba(139, 92, 246, 0.15); color: #ddd6fe;
    border: 1px solid rgba(139, 92, 246, 0.4); outline: none; cursor: pointer;
    font-family: var(--num-font); font-weight: 700;
}
.starfall-select option { background: #1e1b2e; color: #ddd6fe; }
.starfall-row {
    display: flex; align-items: center; gap: 8px;
}
.starfall-dmg {
    font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; color: #a78bfa;
    flex: 1;
}
.starfall-dmg.lethal { color: #f87171; }
.starfall-sub {
    font-size: 9.5px; color: var(--dim); font-variant-numeric: tabular-nums;
}

/* ================= 愿力冲击暗手推演模块 ================= */
.resonance-box {
    margin-top: 8px; padding: 8px 10px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(99, 102, 241, 0.06));
    border: 1px solid rgba(168, 85, 247, 0.25);
}
.resonance-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
}
.resonance-title {
    font-size: 12px; font-weight: 700; color: #d8b4fe; display: flex; align-items: center; gap: 5px;
}
.resonance-inferred {
    display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--dim);
    flex-wrap: wrap; margin-bottom: 6px; padding: 3px 6px; border-radius: 6px; background: rgba(0,0,0,0.25);
}
.resonance-cases-grid {
    display: flex; flex-direction: column; gap: 4px;
}
.attr-pill {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 10.5px; font-weight: 600; color: #f1f5f9;
}
.attr-pill-img {
    width: 14px; height: 14px; object-fit: contain; flex-shrink: 0;
}
.res-case-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
}
.res-case-card.lethal {
    background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.4);
}
.res-left {
    display: flex; align-items: center; gap: 6px;
}
.res-name {
    font-size: 11px; font-weight: 700; color: var(--text);
}
.res-tag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: rgba(168, 85, 247, 0.2); color: #c084fc; font-weight: 600;
}
.res-tag.warn {
    background: rgba(245, 158, 11, 0.2); color: #fbbf24;
}
.res-tag.extreme {
    background: rgba(239, 68, 68, 0.25); color: #fca5a5;
}
.res-right {
    display: flex; align-items: center; gap: 6px;
}
.res-dmg {
    font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums; color: #38bdf8;
}
.res-dmg.lethal {
    color: #f87171;
}

/* 敌方威胁雷达 */
.threat-card {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 8px; border-radius: 6px;
    background: rgba(239, 68, 68, 0.06); border: 1px solid rgba(239, 68, 68, 0.15);
    margin-bottom: 4px;
}
.threat-card.lethal {
    border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.15);
}
.threat-name {
    flex: 1; font-size: 11px; font-weight: 600; color: #fca5a5;
    display: flex; align-items: center; gap: 4px;
}
.threat-dmg {
    font-size: 11.5px; font-weight: 700; color: #f87171; font-variant-numeric: tabular-nums;
}

.empty-state {
    text-align: center; padding: 32px 10px; color: var(--dim); font-size: 12px;
}

    /* ---------- PVP 推演浮层 · 绘本化(与合并悬浮窗同源) ---------- */
    .card {
        background: var(--card-bg);
        border: 1px solid var(--card-edge);
        box-shadow: 0 6px 24px rgba(70, 52, 24, 0.35), 0 0 0 3px rgba(51, 42, 29, 0.85);
    }
    .head { background: linear-gradient(180deg, #3a3021, #2e2618); border-bottom: 2px solid #211a10; }
    .title { color: #f4e8c8; font-family: 'KaiTi','STKaiti','楷体',serif; }
    .fold-btn { background: rgba(230,196,106,0.1); border: 1px solid rgba(230,196,106,0.25); color: #e6c46a; }
    .dot { background: #8a7a5e; }
    .dot.on, .dot[style*="22c55e"] { background: var(--leaf); }
    .speed-badge { background: var(--gold-soft); border: 1px solid var(--card-edge); color: var(--gold); }
    .body { color: var(--ink-1); }
    .sec-title { color: var(--ink-3); }
    .pet-header, .pet-info { color: var(--ink-1); }
    .pet-name { color: var(--ink-1); }
    .pet-side.player { color: var(--leaf); }
    .pet-side.enemy { color: var(--wax); }
    .vs-banner { background: linear-gradient(90deg, rgba(138,100,32,0.15), rgba(168,64,47,0.15)); border: 1px solid var(--card-edge); color: var(--ink-1); }
    .vs-tag { background: #5a4426; color: #f9f1da; }
    .bar-track { background: #e7dbba; border: 1px solid var(--line); }
    .bar-fill { background: rgba(63,52,40,0.55); }
    .stat-nums, .hp-val { color: var(--ink-1); font-family: var(--num-font); }
    .attr-pill { background: #fffdf6; border: 1px solid var(--line); color: var(--ink-1); }
    .attr-badge-img, .attr-pill-img { filter: none; }
    .skills-grid .skill-card { background: #f7f0da; border: 1px solid var(--line); }
    .skill-name { color: var(--ink-1); }
    .skill-type-tag { background: #efe5c8; color: var(--ink-2); }
    .skill-dmg-box .skill-dmg-num { color: var(--teal); }
    .kill-tag { background: var(--wax); }
    .skill-mult { color: var(--leaf); }
    .skill-icon { background: #fffdf6; border: 1px solid var(--line); }
    .resonance-box { background: rgba(138,100,32,0.07); border: 1px solid rgba(138,100,32,0.3); }
    .resonance-title { color: var(--gold); }
    .resonance-inferred { background: #f3ead0; color: var(--ink-2); }
    .res-case-card { background: #f7f0da; border: 1px solid var(--line); }
    .res-case-card.lethal { background: rgba(168,64,47,0.12); border-color: rgba(168,64,47,0.45); }
    .res-name { color: var(--ink-1); }
    .res-tag { background: var(--gold-soft); color: var(--gold); }
    .res-tag.warn { background: rgba(176,125,30,0.18); color: #8a6410; }
    .res-tag.extreme { background: rgba(168,64,47,0.2); color: var(--wax); }
    .res-dmg { color: var(--teal); }
    .res-dmg.lethal { color: var(--wax); }
    .threat-card { background: rgba(168,64,47,0.06); border: 1px solid rgba(168,64,47,0.2); }
    .threat-card.lethal { background: rgba(168,64,47,0.14); border-color: rgba(168,64,47,0.5); }
    .threat-name { color: var(--wax); }
    .threat-dmg { color: var(--wax); }
    .empty-state { color: var(--ink-3); }
    .energy-crystals { color: var(--teal); }
    .energy-row { color: var(--ink-2); }
    .skill-dyn-tag { background: var(--gold-soft); color: var(--teal); }
    .starfall-box { background: rgba(139, 92, 246, 0.07); border: 1px solid rgba(139, 92, 246, 0.3); }
    .starfall-title { color: #6d5aa8; }
    .starfall-select { background: #f3eaff; color: #5b4a94; border: 1px solid rgba(139, 92, 246, 0.4); }
    .starfall-select option { background: #f6efdc; color: #5b4a94; }
    .starfall-dmg { color: #7c5cd6; }
    .starfall-dmg.lethal { color: var(--wax); }
    .starfall-sub { color: var(--ink-3); }

    /* ===== AI 陪玩弹幕条 ===== */
    .ai-chat {
        border-top: 1px dashed rgba(139, 92, 246, 0.35);
        margin-top: 8px; padding: 5px 2px 2px;
        min-height: 46px; max-height: 64px; overflow: hidden;
        display: flex; flex-direction: column; gap: 3px;
    }
    .ai-chat .ai-line {
        display: flex; align-items: flex-start; gap: 5px;
        font-size: 11px; line-height: 1.45;
        color: var(--ink-2);
        animation: aiFadeIn 0.25s ease-out;
    }
    .ai-chat .ai-line .ai-tag {
        flex: 0 0 auto; font-size: 9px; font-weight: 800;
        padding: 1px 5px; border-radius: 999px; margin-top: 1px;
        background: rgba(139, 92, 246, 0.16); color: #6d5aa8;
    }
    .ai-chat .ai-line.mood-hype .ai-tag { background: rgba(250, 204, 21, 0.25); color: #a16207; }
    .ai-chat .ai-line.mood-care .ai-tag { background: rgba(74, 222, 128, 0.2); color: #3f6212; }
    .ai-chat .ai-line.mood-salt .ai-tag { background: rgba(248, 113, 113, 0.2); color: #b91c1c; }
    .ai-chat .ai-empty { font-size: 10px; color: var(--ink-3); padding: 6px 2px; }

    /* ===== AI 战术决策面板 ===== */
    .ai-decision-box {
        margin-top: 8px; padding: 8px 10px; border-radius: 10px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(59, 130, 246, 0.06));
        border: 1px solid rgba(99, 102, 241, 0.25);
    }
    .ai-decision-box .ai-d-head {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;
    }
    .ai-decision-box .ai-d-title {
        font-size: 11px; font-weight: 700; color: #a5b4fc; display: flex; align-items: center; gap: 4px;
    }
    .ai-d-action {
        font-size: 14px; font-weight: 800; color: #38bdf8;
        padding: 4px 0 2px;
    }
    .ai-d-action .ai-d-target {
        color: #fbbf24;
    }
    .ai-d-reason {
        font-size: 10.5px; color: var(--ink-2); line-height: 1.55; margin: 3px 0;
    }
    .ai-d-risk {
        font-size: 10px; color: #f87171; margin-top: 3px; padding: 3px 6px;
        border-radius: 5px; background: rgba(248, 113, 113, 0.1);
    }
    .ai-d-conf {
        font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
    }
    .ai-d-conf.high { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .ai-d-conf.medium { background: rgba(250, 204, 21, 0.2); color: #eab308; }
    .ai-d-conf.low { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .ai-d-alts {
        margin-top: 4px; padding-top: 4px; border-top: 1px dashed rgba(255,255,255,0.08);
        font-size: 9.5px; color: var(--dim);
    }
    .ai-d-alt-item {
        padding: 2px 0; display: flex; align-items: center; gap: 4px;
        cursor: pointer;
    }
    .ai-d-alt-item:hover { color: var(--text); }
    .ai-d-spinner {
        display: inline-block; width: 12px; height: 12px;
        border: 2px solid var(--dim); border-top-color: #a5b4fc;
        border-radius: 50%; animation: aiSpin 0.8s linear infinite;
        margin-right: 4px;
    }
    @keyframes aiSpin { to { transform: rotate(360deg); } }
    .ai-d-empty { font-size: 10px; color: var(--dim); padding: 6px 8px; text-align: center; }
    @keyframes aiFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ===== 信息架构: 紧凑卡常显 + 推演详情折叠 ===== */
    .pv-detail-fold {
        margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.14);
    }
    .pv-detail-head {
        width: 100%; text-align: left; cursor: pointer;
        background: transparent; border: none; color: var(--dim);
        font-family: inherit; font-size: 10.5px; font-weight: 700;
        padding: 8px 2px 6px;
    }
    .pv-detail-head:hover { color: var(--text); }
    #pvDetailBody { padding-bottom: 4px; }
    .pv-detail-empty {
        color: var(--dim); font-size: 10.5px; text-align: center; padding: 8px 0;
    }
    .adv-compact {
        margin-top: 8px; padding: 7px 10px; border-radius: 10px;
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(59, 130, 246, 0.06));
        border: 1px solid rgba(99, 102, 241, 0.25);
    }
    .adv-compact .adv-conf { flex: 0 0 auto; }
    .adv-compact .adv-reason {
        flex-basis: 100%; font-size: 10px; color: var(--ink-2); line-height: 1.5;
    }
    .enemy-cast-line {
        margin-top: 8px; padding: 6px 10px; border-radius: 8px;
        font-size: 11px; color: var(--ink-1);
        background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.22);
    }
    .enemy-cast-line.lethal {
        background: rgba(248, 113, 113, 0.16);
        border-color: rgba(248, 113, 113, 0.45);
        color: #f87171; font-weight: 700;
    }
</style>
</head>
<body>
<div class="card" id="card">
    <div class="head" id="head">
        <div class="dot" id="statusDot"></div>
        <div class="title">
            <span>PVP 实时推演</span>
            <span class="badge">AI PRO</span>
        </div>
        <div class="speed-badge" id="speedBadge">--</div>
        <button class="fold-btn" id="foldBtn" onclick="toggleFold()" title="折叠/展开">▾</button>
    </div>

    <div class="body" id="pvpBody">
        <div class="empty-state">
            <div style="font-size: 24px; margin-bottom: 8px;">⚔️</div>
            <div>等待进入 PVP 对战画面…</div>
            <div style="font-size: 10px; color: var(--dim); margin-top: 4px;">识别到双方精灵后将自动计算面板、必杀与暗手愿力</div>
        </div>
    </div>
</div>

<script>
let folded = false;
const PVP_W = 360, H_EXPANDED = 540, H_FOLDED = 42;

// 星陨印记: 用户手选层数(1~10), 默认按当前致死层数自动跟随; 手动选择后固定
// updatePVPData 每 500ms 全量重绘 innerHTML, 下拉框状态必须存在 JS 变量里, 不能依赖 DOM
let starfallMode = 'auto';          // 'auto' | 'manual'
let starfallManualStacks = 0;
let _lastStarfallTable = null;      // 缓存最近一次推送的速查表, 供下拉重渲染
let _lastEnemyHp = 0;               // 缓存敌方估算 HP, 供本地重绘致死判定
let _lastPayload = null;            // 缓存最近一次完整推送, 供下拉变更后本地重绘

// 属性映射
const ATTR_MAP = {
    "火": "fire.webp", "水": "water.webp", "草": "grass.webp", "电": "electric.webp", "冰": "ice.webp",
    "虫": "bug.webp", "翼": "flying.webp", "地": "ground.webp", "萌": "fairy.webp", "武": "fighting.webp",
    "毒": "poison.webp", "龙": "dragon.webp", "幽": "ghost.webp", "恶": "dark.webp", "光": "light.webp",
    "普通": "normal.webp", "机械": "steel.webp", "幻": "psychic.webp"
};

function getAttrIcon(attr) {
    if (!attr) return '';
    const clean = String(attr).replace('系', '').trim();
    const file = ATTR_MAP[clean] || ATTR_MAP[clean.toLowerCase()];
    return file ? `assets/img/icons/${file}` : '';
}

function getPetAvatar(name) {
    if (!name) return 'assets/img/icons/normal.webp';
    const map = window.PET_ASSET_MAP;
    if (!map) return 'assets/img/icons/normal.webp';

    const raw = String(name).trim();
    // 1. 直接精准匹配
    if (map[raw]) return `assets/img/pets/${map[raw]}`;

    // 2. 去除括号形态修饰（如 "白金独角兽（变体形态）" -> "白金独角兽"）
    const clean = raw.replace(/[\(（].*?[\)）]/g, '').trim();
    if (clean && map[clean]) return `assets/img/pets/${map[clean]}`;

    // 3. 数字编号匹配（如 117 或 #117）
    const numMatch = raw.match(/\d+/);
    if (numMatch) {
        const num = parseInt(numMatch[0], 10);
        const pad3 = String(num).padStart(3, '0');
        for (const [k, v] of Object.entries(map)) {
            if (v.startsWith(`${pad3}_`) || v.startsWith(`${num}_`)) {
                return `assets/img/pets/${v}`;
            }
        }
    }

    // 4. 模糊包含匹配
    for (const [k, v] of Object.entries(map)) {
        if (clean && (k.includes(clean) || clean.includes(k))) {
            return `assets/img/pets/${v}`;
        }
    }

    return 'assets/img/icons/normal.webp';
}

function getSkillIcon(name) {
    if (!name) return '';
    return `assets/img/skills/${encodeURIComponent(name.trim())}.webp`;
}

async function toggleFold() {
    folded = !folded;
    document.getElementById('pvpBody').style.display = folded ? 'none' : '';
    document.getElementById('foldBtn').textContent = folded ? '▴' : '▾';
    // 等布局完成再按内容真实尺寸同步(修 DPI 缩放截断)
    requestAnimationFrame(() => setTimeout(syncPvpSize, 30));
}

// 按内容真实尺寸同步窗口(乘 devicePixelRatio 换算物理像素)
function syncPvpSize() {
    const body = document.body;
    const dpr = window.devicePixelRatio || 1;
    const w = Math.ceil(Math.max(body.scrollWidth, PVP_W) * dpr);
    const h = Math.ceil(Math.max(body.scrollHeight, H_FOLDED) * dpr);
    if (window.pywebview && pywebview.api.pvp_float_resize) {
        pywebview.api.pvp_float_resize(w, h);
    }
}

// 初始尺寸校准(等 pywebview 桥就绪)
(function waitInit() {
    if (window.pywebview && pywebview.api && pywebview.api.pvp_float_resize) {
        setTimeout(syncPvpSize, 100);
    } else {
        setTimeout(waitInit, 300);
    }
})();

// 星陨层数下拉: 选择后进入手动模式(不再自动跟随致死层数)

// ===== AI 陪玩弹幕条 (由主程序 /comment 端点推送) =====
let _aiChatLines = [];
// 按主程序推送的 state 开关 AI 对话框
window.onStateUpdate = window.onStateUpdate || function(st) {
    const box = document.getElementById('aiChat');
    if (!box) return;
    const show = st && st.companion_enabled;
    box.style.display = show ? '' : 'none';
};
function pushAiComment(text, mood) {
    mood = mood || 'normal';
    _aiChatLines.push({ text: String(text || '').slice(0, 120), mood: String(mood), ts: Date.now() });
    if (_aiChatLines.length > 3) _aiChatLines = _aiChatLines.slice(-3);
    renderAiChat();
}
function renderAiChat() {
    const box = document.getElementById('aiChat');
    if (!box) return;
    if (!_aiChatLines.length) {
        box.innerHTML = '<div class="ai-empty">💬 AI 伙伴待命中…</div>';
        return;
    }
    const TAGS = { hype: '🔥', care: '💚', salt: '🌶', normal: '✨' };
    box.innerHTML = _aiChatLines.map(l => {
        const tag = TAGS[l.mood] || '✨';
        return '<div class="ai-line mood-' + l.mood + '">'
            + '<span class="ai-tag">' + tag + ' AI</span>'
            + '<span>' + l.text + '</span></div>';
    }).join('');
}
function onStarfallSelect(value) {
    starfallMode = 'manual';
    starfallManualStacks = parseInt(value, 10) || 1;
    // 用缓存数据本地重绘(不等待下一次 500ms 推送), 反馈立即生效
    if (_lastPayload) updatePVPData(_lastPayload);
}

// ===== 信息架构: 紧凑卡常显 + 推演详情折叠 =====
// (自动上下文切换已按用户反馈移除: 标签只受手动控制, 不再随战斗状态抢切)
let _pvDetailOpen = false;      // 详情折叠态
let _pvDetailDirty = false;     // 折叠期间数据来过 → 展开时补画一次

function _ensurePvContainers(bodyEl) {
    // 骨架常显: 保证 #pvCompact / #pvDetail 容器存在(卡片常显原则)
    if (!document.getElementById('pvCompact')) {
        bodyEl.insertAdjacentHTML('afterbegin',
            '<div id="pvCompact"></div>' +
            '<div class="pv-detail-fold" id="pvDetail">' +
            '<button class="pv-detail-head" id="pvDetailBtn" onclick="togglePvpDetail()">📌 推演详情（星陨/愿力/AI详析/威胁） ▸</button>' +
            '<div id="pvDetailBody" style="display:none"></div></div>');
    }
}

function togglePvpDetail() {
    _pvDetailOpen = !_pvDetailOpen;
    const body = document.getElementById('pvDetailBody');
    const btn = document.getElementById('pvDetailBtn');
    if (!body) return;
    body.style.display = _pvDetailOpen ? '' : 'none';
    if (btn) btn.textContent = _pvDetailOpen
        ? '📌 收起推演详情 ▾'
        : '📌 推演详情（星陨/愿力/AI详析/威胁） ▸';
    // 折叠期间数据来过 → 展开时补画一次
    if (_pvDetailOpen && _pvDetailDirty && _lastPayload) {
        updatePVPData(_lastPayload);
        return;   // updatePVPData 内部已渲染详情
    }
    if (typeof syncSize === 'function') setTimeout(syncSize, 50);
    else if (typeof syncPvpSize === 'function') setTimeout(syncPvpSize, 50);
}

function updatePVPData(data) {
    // 内容高度随数据变化,渲染后自动校准窗口尺寸
    requestAnimationFrame(() => setTimeout(syncPvpSize, 50));
    const statusDot = document.getElementById('statusDot');
    const speedBadge = document.getElementById('speedBadge');
    const bodyEl = document.getElementById('pvpBody');

    // 下拉框若正被用户操作(展开/聚焦), 跳过本轮重绘, 防止选择被打断
    const sfSelect = document.getElementById('starfallStacksSelect');
    if (sfSelect && (document.activeElement === sfSelect || sfSelect._open)) {
        setTimeout(() => updatePVPData(data), 400);
        return;
    }

    if (!data || !data.in_battle) {
        statusDot.className = 'dot off';
        speedBadge.textContent = '--';
        speedBadge.className = 'speed-badge';
        return; // 保留上一次的推演内容不清空
    }

    statusDot.className = 'dot';
    const p = data.player || {}, e = data.enemy || {};
    _lastPayload = data;

    // 速度判定
    const sd = data.speed_diff;
    const esr = data.enemy_speed_range;
    if (esr && esr.min && esr.max) {
        speedBadge.title = `敌方《洛克王国：世界》速度区间: ${esr.range_str} (满配极速: ${esr.max}, 减速0点: ${esr.min})`;
        if (sd !== undefined && sd !== null) {
            speedBadge.className = 'speed-badge ' + (sd > 0 ? 'fast' : sd < 0 ? 'slow' : '');
            speedBadge.textContent = (sd > 0 ? `⚡ 先手 +${sd}` : `🐢 后手 ${sd}`) + ` [${esr.range_str}]`;
        } else {
            speedBadge.textContent = `敌速 ${esr.range_str}`;
            speedBadge.className = 'speed-badge';
        }
    } else if (sd !== undefined && sd !== null) {
        speedBadge.textContent = sd > 0 ? `⚡ 先手 +${sd}` : sd < 0 ? `🐢 后手 ${sd}` : '= 平速';
        speedBadge.className = 'speed-badge ' + (sd > 0 ? 'fast' : sd < 0 ? 'slow' : '');
    } else {
        speedBadge.textContent = '--';
        speedBadge.className = 'speed-badge';
    }

    // 双方血量与属性
    const enemyHpPct = Math.round((e.hp_pct !== undefined ? e.hp_pct : 1.0) * 100);
    const enemyHpColor = enemyHpPct > 50 ? 'green' : enemyHpPct > 20 ? 'yellow' : 'red';

    const playerHp = p.hp || '?';
    const playerHpMax = p.hp_max || 450;
    const playerHpPct = typeof playerHp === 'number' ? Math.min(100, Math.round((playerHp / playerHpMax) * 100)) : 100;
    const playerHpColor = playerHpPct > 50 ? 'green' : playerHpPct > 20 ? 'yellow' : 'red';

    const playerAvatar = getPetAvatar(p.name);
    const enemyAvatar = getPetAvatar(e.name);

    const playerAttrIcons = (p.types || []).map(t => `<img class="attr-badge-img" src="${getAttrIcon(t)}" title="${t}">`).join('');
    const enemyAttrIcons = (e.types || []).map(t => `<img class="attr-badge-img" src="${getAttrIcon(t)}" title="${t}">`).join('');

    // 我方技能伤害推演
    let skillsHtml = '';
    if (data.calc_skills && data.calc_skills.length) {
        skillsHtml = data.calc_skills.map(s => {
            const isKill = s.is_kill;
            const dmgText = s.dmg_min > 0 ? `${s.dmg_min} ~ ${s.dmg_max}` : '状态/无伤';
            const multText = s.mult && s.mult > 1 ? `×${s.mult.toFixed(1)} 克制` : (s.mult && s.mult < 1 ? `×${s.mult.toFixed(1)} 抵抗` : '');
            const iconUrl = getSkillIcon(s.name);
            const typeBadge = s.type || '技能';
            // 动态威力技能: 展示查档依据(物防差+31 → 档3)
            const dynTag = s.dynamic
                ? `<span class="skill-dyn-tag">${s.dynamic.statLabel}${s.dynamic.diff >= 0 ? '+' : ''}${s.dynamic.diff} · 档${s.dynamic.tierIndex + 1}</span>`
                : '';

            return `
            <div class="skill-card ${isKill ? 'kill' : ''}">
                <img class="skill-icon" src="${iconUrl}" onerror="this.src='assets/img/icons/normal.webp'">
                <div class="skill-main">
                    <div class="skill-name-row">
                        <span class="skill-name">${s.name}</span>
                        <span class="skill-type-tag">${typeBadge}</span>
                        ${dynTag}
                    </div>
                </div>
                <div class="skill-dmg-box">
                    <div class="skill-dmg-num ${isKill ? 'kill' : ''}">${dmgText}</div>
                    ${multText ? `<div class="skill-mult">${multText}</div>` : ''}
                    ${isKill ? `<span class="kill-tag">必杀斩杀</span>` : ''}
                </div>
            </div>`;
        }).join('');
    }

    // 星陨印记引爆速查(层数²+24×层数−24)
    if (data.starfall_table && data.starfall_table.length) {
        _lastStarfallTable = data.starfall_table;
    }
    // 敌方估算 HP: 优先用后端直接给的, 否则按面板 HP × 血条百分比估
    const enemyHpFromPanel = (e.hp && e.hp_max) ? Math.round(e.hp) : 0;
    _lastEnemyHp = data.enemy_est_hp || enemyHpFromPanel
        || (data.enemy_panel_hp ? Math.round(data.enemy_panel_hp * (e.hp_pct !== undefined ? e.hp_pct : 1.0)) : 0);
    let starfallHtml = '';
    if (_lastStarfallTable && _lastStarfallTable.length) {
        const sfTable = _lastStarfallTable;
        // auto 模式: 跟随"最小致死层数"; 手动模式: 用用户选的层数
        const enemyHp = _lastEnemyHp;
        const autoStacks = (enemyHp > 0 && (sfTable.find(t => t.damage >= enemyHp) || sfTable[sfTable.length - 1]).stacks) || 1;
        const sel = starfallMode === 'manual'
            ? Math.min(starfallManualStacks, sfTable.length)
            : autoStacks;
        const row = sfTable.find(t => t.stacks === sel) || sfTable[0];
        const isLethal = enemyHp > 0 && row.damage >= enemyHp;
        const optionsHtml = sfTable.map(t =>
            `<option value="${t.stacks}" ${t.stacks === sel ? 'selected' : ''}>${t.stacks} 层 · 威力${t.power}</option>`
        ).join('');
        const subText = enemyHp > 0
            ? (starfallMode === 'auto' ? `当前致死至少 ${autoStacks} 层 (敌HP ${enemyHp})` : `敌HP ${enemyHp}`)
            : `威力 = 层数² + 24×层数 − 24`;

        starfallHtml = `
        <div class="starfall-box">
            <div class="starfall-head">
                <span class="starfall-title">✨ 星陨印记引爆</span>
                <select class="starfall-select" id="starfallStacksSelect"
                        onchange="onStarfallSelect(this.value)" title="选择当前敌方身上的星陨层数">
                    ${optionsHtml}
                </select>
            </div>
            <div class="starfall-row">
                <span class="starfall-dmg ${isLethal ? 'lethal' : ''}" id="starfallDmg">${row.damage}</span>
                <span class="starfall-sub">${subText}</span>
            </div>
        </div>`;
    }

    // 愿力冲击暗手伤害推演
    let resonanceHtml = '';
    if (data.resonance_impact && data.resonance_impact.cases) {
        const res = data.resonance_impact;
        const likelyIcons = (res.likely_counter_attrs || []).map(t => 
            `<span class="attr-pill"><img class="attr-pill-img" src="${getAttrIcon(t)}" alt="${t}"><span>${t}</span></span>`
        ).join(' ');

        const casesHtml = res.cases.map(c => {
            const isLethal = c.is_lethal;
            const badgeClass = c.id === '3x_no_counter' ? 'extreme' : (c.counter_mult > 1.0 ? 'warn' : '');
            const attrIconHtml = c.attr ? `<img class="attr-badge-img" src="${getAttrIcon(c.attr)}" title="${c.attr}" onerror="this.style.display='none'">` : '';
            return `
            <div class="res-case-card ${isLethal ? 'lethal' : ''}" title="${c.desc}">
                <div class="res-left">
                    ${attrIconHtml}
                    <span class="res-name">${c.name}</span>
                    <span class="res-tag ${badgeClass}">${c.badge}</span>
                </div>
                <div class="res-right">
                    <span class="res-dmg ${isLethal ? 'lethal' : ''}">${c.dmg_min} ~ ${c.dmg_max}</span>
                    ${isLethal ? `<span class="kill-tag" style="font-size:8.5px;">致死</span>` : ''}
                </div>
            </div>`;
        }).join('');

        resonanceHtml = `
        <div class="resonance-box">
            <div class="resonance-head">
                <span class="resonance-title">🔮 敌方暗手 · 愿力冲击推演 (80威力)</span>
                <span style="font-size:9.5px;color:var(--dim);">${res.atk_stat_name || '主攻'}</span>
            </div>
            ${likelyIcons ? `<div class="resonance-inferred"><span>🎯 预测反制愿力:</span> ${likelyIcons}</div>` : ''}
            <div class="resonance-cases-grid">
                ${casesHtml}
            </div>
        </div>`;
    }

    // 敌方常规威胁雷达与官方机制标签
    let threatsHtml = '';
    if (data.enemy_threats && data.enemy_threats.length) {
        threatsHtml = `
            <div class="sec-title">🎯 敌方预测伤害 (按其种族高项筛选)</div>
            ${data.enemy_threats.map(t => {
                const isLethal = t.is_lethal;
                const iconUrl = getSkillIcon(t.name);
                const tagsHtml = (t.tags || []).map(tg => `<span class="res-tag" style="font-size:8.5px;padding:1px 4px;">${tg}</span>`).join(' ');
                return `
                <div class="threat-card ${isLethal ? 'lethal' : ''}">
                    <img class="skill-icon" style="width:20px;height:20px;" src="${iconUrl}" onerror="this.src='assets/img/icons/normal.webp'">
                    <div style="flex:1;display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                        <span class="threat-name">${t.name}</span>
                        ${tagsHtml}
                    </div>
                    <div class="threat-dmg">${t.dmg_min} ~ ${t.dmg_max}</div>
                    ${isLethal ? `<span class="kill-tag">致死预警</span>` : ''}
                </div>`;
            }).join('')}
        `;
    }

    // VS 看板(紧凑卡常显区第一块)
    const vsBannerHtml = `
        <div class="vs-banner">
            <div class="pet-side player">
                <div class="pet-header">
                    <img class="pet-avatar" src="${playerAvatar}" onerror="this.src='assets/img/icons/normal.webp'">
                    <div class="pet-info">
                        <div class="pet-name">${p.name || '我方精灵'}</div>
                        <div class="pet-attrs">${playerAttrIcons || '<span style="font-size:9.5px;color:var(--dim)">常规</span>'}</div>
                    </div>
                </div>
                <div class="stat-bar-box">
                    <div class="stat-nums">
                        <span style="color:var(--dim)">HP</span>
                        <span class="hp-val">${playerHp}</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${100 - playerHpPct}%"></div>
                    </div>
                </div>
                <div class="energy-row">
                    <span>能量</span>
                    <span class="energy-crystals">🔷 ${p.energy !== undefined ? p.energy : '?'}</span>
                </div>
            </div>

            <div class="vs-divider">
                <div class="vs-tag">VS</div>
            </div>

            <div class="pet-side enemy">
                <div class="pet-header">
                    <img class="pet-avatar" src="${enemyAvatar}" onerror="this.src='assets/img/icons/normal.webp'">
                    <div class="pet-info">
                        <div class="pet-name">${e.name || '敌方精灵'}</div>
                        <div class="pet-attrs">${enemyAttrIcons || '<span style="font-size:9.5px;color:var(--dim)">常规</span>'}</div>
                    </div>
                </div>
                <div class="stat-bar-box">
                    <div class="stat-nums">
                        <span class="hp-val">${enemyHpPct}%</span>
                        <span style="color:var(--dim)">HP</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${100 - enemyHpPct}%"></div>
                    </div>
                </div>
                <div class="energy-row" style="justify-content: flex-end;">
                    <span>目标</span>
                    <span style="color: #f87171; font-weight:700;">锁定中</span>
                </div>
            </div>
        </div>`;

    // AI 战术建议解析
    const rawAdvice = data.ai_advice;
    let advice = { actionLabel: '分析中…', reasoning: '', risk: '', confidence: 'medium', altsHtml: '' };
    if (rawAdvice && rawAdvice.recommendation) {
        const r = rawAdvice.recommendation;
        const actionMap = { 'skill': '⚔️ 出招', 'switch': '🔄 换宠', 'energize': '⚡ 聚能', 'resonance': '🔮 愿力冲击' };
        const actionIcon = actionMap[r.action] || ('➡️ ' + r.action);
        const targetHtml = r.target ? `<span class="ai-d-target">${r.target}</span>` : '';
        advice = {
            actionLabel: `${actionIcon} ${targetHtml}`,
            reasoning: r.reasoning || '',
            risk: r.risk || '',
            confidence: r.confidence || 'medium',
            altsHtml: ''
        };
        if (rawAdvice.alternatives && rawAdvice.alternatives.length) {
            advice.altsHtml = rawAdvice.alternatives.map(a =>
                ` <span style="font-size:9px;color:var(--dim);display:block;padding:1px 0;">↳ ${a.action}: ${a.target} — ${(a.reasoning || '').slice(0, 40)}</span>`
            ).join('');
        }
    } else if (!rawAdvice) {
        advice = { actionLabel: '等待推演…', reasoning: '', risk: '', confidence: 'medium', altsHtml: '' };
    } else if (rawAdvice.error) {
        advice = { actionLabel: '推演异常', reasoning: rawAdvice.error, risk: '', confidence: 'low', altsHtml: '' };
    }

    // ===== 信息架构: 紧凑对局卡常显, 推演详情折叠 =====
    // 常显(每帧刷新): VS看板 / AI建议一行 / 我方技能4卡 / 敌方上招与致死预警
    // 折叠(展开时才刷新): 星陨速查 / 愿力推演 / AI完整理由 / 敌方威胁全表
    const enemyCast = (data.enemy_last_cast || '').toString().trim();
    const lethalThreat = (data.enemy_threats || []).find(t => t.is_lethal);
    const lethalHtml = lethalThreat
        ? `<div class="enemy-cast-line lethal">⚠️ 致死预警: <b>${lethalThreat.name}</b> ${lethalThreat.dmg_min}~${lethalThreat.dmg_max}</div>`
        : '';

    const compactHtml = `
        ${vsBannerHtml}
        <div class="adv-compact">
            <span class="ai-d-action" style="padding:0;font-size:13px;">${advice.actionLabel}</span>
            <span class="adv-conf ai-d-conf ${advice.confidence || 'medium'}">${(advice.confidence === 'high' ? '高' : advice.confidence === 'low' ? '低' : '中')}</span>
            ${advice.reasoning ? `<div class="adv-reason">${advice.reasoning.slice(0, 64)}${advice.reasoning.length > 64 ? '…' : ''}</div>` : ''}
        </div>
        <div class="sec-title">🎯 我方技能即时伤害推演</div>
        <div class="skills-grid">
            ${skillsHtml || '<div style="color:var(--dim);font-size:11px;padding:8px 0;text-align:center;">暂无技能推演数据</div>'}
        </div>
        ${enemyCast ? `<div class="enemy-cast-line">🗡️ 敌方上招: <b>${enemyCast}</b></div>` : ''}
        ${lethalHtml}
    `;

    const detailHtml = `
        ${starfallHtml || '<div class="pv-detail-empty">星陨数据等待推送…</div>'}
        ${resonanceHtml || ''}
        <div class="ai-decision-box" id="aiDecisionBox">
            <div class="ai-d-head">
                <span class="ai-d-title">🧠 AI 战术建议 · 完整分析</span>
                <span class="ai-d-conf ${advice.confidence || 'medium'}">${(advice.confidence === 'high' ? '高' : advice.confidence === 'low' ? '低' : '中') || '中'}</span>
            </div>
            <div class="ai-d-reason">${advice.reasoning || '（暂无完整理由）'}</div>
            ${advice.risk ? `<div class="ai-d-risk">⚠️ ${advice.risk}</div>` : ''}
            ${advice.altsHtml ? `<div class="ai-d-alts">备选方案:${advice.altsHtml}</div>` : ''}
        </div>
        <div class="sec-title">🎯 敌方预测伤害 (按其种族高项筛选)</div>
        ${threatsHtml || '<div class="pv-detail-empty">暂无威胁数据</div>'}
    `;

    _ensurePvContainers(bodyEl);
    const compactEl = document.getElementById('pvCompact');
    if (compactEl) compactEl.innerHTML = compactHtml;

    // 详情区: 折叠时只标脏不渲染(省 80% 重排), 展开瞬间补画一次
    const detailBody = document.getElementById('pvDetailBody');
    if (detailBody) {
        if (_pvDetailOpen) {
            detailBody.innerHTML = detailHtml;
            _pvDetailDirty = false;
        } else {
            _pvDetailDirty = true;
        }
    }

    // 下拉展开期标记(mousedown→change 之间), 配合 updatePVPData 开头的跳过逻辑防打断
    const newSelect = document.getElementById('starfallStacksSelect');
    if (newSelect) {
        newSelect.addEventListener('mousedown', () => { newSelect._open = true; });
        newSelect.addEventListener('blur', () => { newSelect._open = false; });
    }
}
</script>
</body>
</html>
