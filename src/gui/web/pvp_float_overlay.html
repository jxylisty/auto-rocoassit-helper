<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PVP 对决实时推演</title>
<script src="assets/pet_asset_map.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* ============ 魔法绘本皮肤 V4.5 (换肤不换骨: DOM/JS 合约原样) ============ */
    :root {
        --paper: #f6efdc;          /* 书页黄 */
        --card-bg: rgba(252, 247, 234, 0.97);
        --card-edge: #c8b482;      /* 金棕描边 */
        --line: #dccfa8;
        --ink-1: #3f3428;          /* 棕墨主字 */
        --ink-2: #655741;
        --ink-3: #8a7a5e;
        --gold: #8a6420;           /* 鎏金强调 */
        --gold-soft: rgba(138, 100, 32, 0.12);
        --cover: #332a1d;          /* 书脊深棕 */
        --foil: #e6c46a;
        --leaf: #4f7a4a;           /* 叶绿 = 正常/成功 */
        --wax: #a8402f;            /* 火漆红 = 战斗/危险 */
        --wax-soft: rgba(168, 64, 47, 0.12);
        --teal: #3d6b5c;
        --num-font: Consolas, 'Cascadia Mono', monospace;
    }
html, body {
    background: transparent;
    width: 100%; height: 100%;
    overflow: hidden;
}
body {
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    color: var(--text); user-select: none; font-size: 12px;
    -webkit-font-smoothing: antialiased;
}
.card {
    width: 100%;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
    overflow: hidden;
    transition: box-shadow 0.3s ease;
}
.card:hover {
    box-shadow: 0 12px 48px rgba(0,0,0,0.75), 0 0 0 1px rgba(99, 102, 241, 0.3);
}

/* 顶部拖拽栏 */
.head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(99, 102, 241, 0.08), rgba(255, 255, 255, 0.02));
    cursor: move;
    height: 42px;
}
.head .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; flex-shrink: 0; }
.head .dot.off { background: #64748b; box-shadow: none; }
.head .title { font-size: 13px; font-weight: 700; flex: 1; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
.head .title .badge { font-size: 9.5px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
.head .speed-badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
}
.head .speed-badge.fast { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.4); color: #4ade80; }
.head .speed-badge.slow { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #f87171; }

.fold-btn {
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
    color: var(--dim); width: 24px; height: 24px;
    border-radius: 6px; cursor: pointer; font-size: 11px;
    line-height: 1; display: flex; align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}
.fold-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(99, 102, 241, 0.2); }

/* 主体容器 */
.body {
    padding: 10px 12px 14px;
    max-height: 490px;
    overflow-y: auto;
}
.body::-webkit-scrollbar { width: 4px; }
.body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 4px; }

/* 对阵双方 VS 看板 */
.vs-banner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    padding: 10px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(239, 68, 68, 0.1));
    border: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 8px;
}
.pet-side {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.pet-side.enemy {
    align-items: flex-end;
    text-align: right;
}
.pet-header {
    display: flex;
    align-items: center;
    gap: 8px;
}
.pet-side.enemy .pet-header {
    flex-direction: row-reverse;
}
.pet-avatar {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.4);
    border: 1.5px solid rgba(59, 130, 246, 0.5);
    object-fit: cover;
    flex-shrink: 0;
}
.pet-side.enemy .pet-avatar {
    border-color: rgba(239, 68, 68, 0.5);
}
.pet-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
}
.pet-name {
    font-size: 13px; font-weight: 700;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 4px;
}
.pet-attrs {
    display: flex; align-items: center; gap: 3px; margin-top: 2px;
}
.pet-side.enemy .pet-attrs {
    justify-content: flex-end;
}
.attr-badge-img {
    width: 15px; height: 15px; object-fit: contain;
}

.vs-divider {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.vs-tag {
    font-size: 12px; font-weight: 900; font-style: italic;
    background: linear-gradient(135deg, #60a5fa, #f87171);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

/* 血条与能量 */
.stat-bar-box {
    width: 100%;
    margin-top: 4px;
}
.stat-nums {
    display: flex; justify-content: space-between; font-size: 10.5px; margin-bottom: 2px; font-variant-numeric: tabular-nums;
}
.stat-nums .hp-val { font-weight: 700; }
.bar-track { height: 6px; border-radius: 999px; overflow: hidden; background: linear-gradient(90deg, #22c55e, #eab308 55%, #ef4444); }
.bar-fill { height: 100%; border-radius: 0 999px 999px 0; margin-left: auto; background: rgba(8, 12, 22, 0.82); transition: width 0.45s ease; }
.energy-row {
    display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); margin-top: 2px;
}
.energy-crystals {
    color: #38bdf8; font-weight: 700; font-size: 12px;
}

/* 小标题 */
.sec-title {
    font-size: 11px; font-weight: 700; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 8px 0 5px; display: flex; align-items: center; gap: 5px;
}

/* 技能与推演列表 */
.skills-grid {
    display: flex; flex-direction: column; gap: 5px;
}
.skill-card {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    transition: all 0.2s ease;
}
.skill-card:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(99, 102, 241, 0.3);
}
.skill-card.kill {
    background: linear-gradient(90deg, rgba(239, 68, 68, 0.12), rgba(245, 158, 11, 0.08));
    border-color: rgba(239, 68, 68, 0.45);
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
    animation: killGlow 1.8s infinite;
}
@keyframes killGlow {
    0%,100% { border-color: rgba(239, 68, 68, 0.45); box-shadow: 0 0 10px rgba(239, 68, 68, 0.15); }
    50% { border-color: rgba(239, 68, 68, 0.85); box-shadow: 0 0 18px rgba(239, 68, 68, 0.35); }
}

.skill-icon {
    width: 26px; height: 26px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
    object-fit: cover; flex-shrink: 0;
}
.skill-main {
    flex: 1; min-width: 0;
}
.skill-name-row {
    display: flex; align-items: center; gap: 5px;
}
.skill-name {
    font-size: 12px; font-weight: 700; color: var(--text);
}
.skill-type-tag {
    font-size: 9.5px; padding: 1px 5px; border-radius: 4px;
    background: rgba(255, 255, 255, 0.06); color: var(--dim);
}
.skill-dmg-box {
    text-align: right;
    display: flex; flex-direction: column; align-items: flex-end;
}
.skill-dmg-num {
    font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: #38bdf8;
}
.skill-dmg-num.kill {
    color: #f87171; font-size: 12.5px;
}
.skill-mult {
    font-size: 9.5px; color: #4ade80; font-weight: 600;
}
.kill-tag {
    font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 3px;
    background: #ef4444; color: #fff; margin-top: 1px;
}

/* ================= 愿力冲击暗手推演模块 ================= */
.resonance-box {
    margin-top: 8px; padding: 8px 10px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(99, 102, 241, 0.06));
    border: 1px solid rgba(168, 85, 247, 0.25);
}
.resonance-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
}
.resonance-title {
    font-size: 12px; font-weight: 700; color: #d8b4fe; display: flex; align-items: center; gap: 5px;
}
.resonance-inferred {
    display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--dim);
    flex-wrap: wrap; margin-bottom: 6px; padding: 3px 6px; border-radius: 6px; background: rgba(0,0,0,0.25);
}
.resonance-cases-grid {
    display: flex; flex-direction: column; gap: 4px;
}
.attr-pill {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 10.5px; font-weight: 600; color: #f1f5f9;
}
.attr-pill-img {
    width: 14px; height: 14px; object-fit: contain; flex-shrink: 0;
}
.res-case-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
}
.res-case-card.lethal {
    background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.4);
}
.res-left {
    display: flex; align-items: center; gap: 6px;
}
.res-name {
    font-size: 11px; font-weight: 700; color: var(--text);
}
.res-tag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: rgba(168, 85, 247, 0.2); color: #c084fc; font-weight: 600;
}
.res-tag.warn {
    background: rgba(245, 158, 11, 0.2); color: #fbbf24;
}
.res-tag.extreme {
    background: rgba(239, 68, 68, 0.25); color: #fca5a5;
}
.res-right {
    display: flex; align-items: center; gap: 6px;
}
.res-dmg {
    font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums; color: #38bdf8;
}
.res-dmg.lethal {
    color: #f87171;
}

/* 敌方威胁雷达 */
.threat-card {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 8px; border-radius: 6px;
    background: rgba(239, 68, 68, 0.06); border: 1px solid rgba(239, 68, 68, 0.15);
    margin-bottom: 4px;
}
.threat-card.lethal {
    border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.15);
}
.threat-name {
    flex: 1; font-size: 11px; font-weight: 600; color: #fca5a5;
    display: flex; align-items: center; gap: 4px;
}
.threat-dmg {
    font-size: 11.5px; font-weight: 700; color: #f87171; font-variant-numeric: tabular-nums;
}

.empty-state {
    text-align: center; padding: 32px 10px; color: var(--dim); font-size: 12px;
}

    /* ---------- PVP 推演浮层 · 绘本化(与合并悬浮窗同源) ---------- */
    .card {
        background: var(--card-bg);
        border: 1px solid var(--card-edge);
        box-shadow: 0 6px 24px rgba(70, 52, 24, 0.35), 0 0 0 3px rgba(51, 42, 29, 0.85);
    }
    .head { background: linear-gradient(180deg, #3a3021, #2e2618); border-bottom: 2px solid #211a10; }
    .title { color: #f4e8c8; font-family: 'KaiTi','STKaiti','楷体',serif; }
    .fold-btn { background: rgba(230,196,106,0.1); border: 1px solid rgba(230,196,106,0.25); color: #e6c46a; }
    .dot { background: #8a7a5e; }
    .dot.on, .dot[style*="22c55e"] { background: var(--leaf); }
    .speed-badge { background: var(--gold-soft); border: 1px solid var(--card-edge); color: var(--gold); }
    .body { color: var(--ink-1); }
    .sec-title { color: var(--ink-3); }
    .pet-header, .pet-info { color: var(--ink-1); }
    .pet-name { color: var(--ink-1); }
    .pet-side.player { color: var(--leaf); }
    .pet-side.enemy { color: var(--wax); }
    .vs-banner { background: linear-gradient(90deg, rgba(138,100,32,0.15), rgba(168,64,47,0.15)); border: 1px solid var(--card-edge); color: var(--ink-1); }
    .vs-tag { background: #5a4426; color: #f9f1da; }
    .bar-track { background: #e7dbba; border: 1px solid var(--line); }
    .bar-fill { background: rgba(63,52,40,0.55); }
    .stat-nums, .hp-val { color: var(--ink-1); font-family: var(--num-font); }
    .attr-pill { background: #fffdf6; border: 1px solid var(--line); color: var(--ink-1); }
    .attr-badge-img, .attr-pill-img { filter: none; }
    .skills-grid .skill-card { background: #f7f0da; border: 1px solid var(--line); }
    .skill-name { color: var(--ink-1); }
    .skill-type-tag { background: #efe5c8; color: var(--ink-2); }
    .skill-dmg-box .skill-dmg-num { color: var(--teal); }
    .kill-tag { background: var(--wax); }
    .skill-mult { color: var(--leaf); }
    .skill-icon { background: #fffdf6; border: 1px solid var(--line); }
    .resonance-box { background: rgba(138,100,32,0.07); border: 1px solid rgba(138,100,32,0.3); }
    .resonance-title { color: var(--gold); }
    .resonance-inferred { background: #f3ead0; color: var(--ink-2); }
    .res-case-card { background: #f7f0da; border: 1px solid var(--line); }
    .res-case-card.lethal { background: rgba(168,64,47,0.12); border-color: rgba(168,64,47,0.45); }
    .res-name { color: var(--ink-1); }
    .res-tag { background: var(--gold-soft); color: var(--gold); }
    .res-tag.warn { background: rgba(176,125,30,0.18); color: #8a6410; }
    .res-tag.extreme { background: rgba(168,64,47,0.2); color: var(--wax); }
    .res-dmg { color: var(--teal); }
    .res-dmg.lethal { color: var(--wax); }
    .threat-card { background: rgba(168,64,47,0.06); border: 1px solid rgba(168,64,47,0.2); }
    .threat-card.lethal { background: rgba(168,64,47,0.14); border-color: rgba(168,64,47,0.5); }
    .threat-name { color: var(--wax); }
    .threat-dmg { color: var(--wax); }
    .empty-state { color: var(--ink-3); }
    .energy-crystals { color: var(--teal); }
    .energy-row { color: var(--ink-2); }
</style>
</head>
<body>
<div class="card" id="card">
    <div class="head" id="head">
        <div class="dot" id="statusDot"></div>
        <div class="title">
            <span>PVP 实时推演</span>
            <span class="badge">AI PRO</span>
        </div>
        <div class="speed-badge" id="speedBadge">--</div>
        <button class="fold-btn" id="foldBtn" onclick="toggleFold()" title="折叠/展开">▾</button>
    </div>

    <div class="body" id="pvpBody">
        <div class="empty-state">
            <div style="font-size: 24px; margin-bottom: 8px;">⚔️</div>
            <div>等待进入 PVP 对战画面…</div>
            <div style="font-size: 10px; color: var(--dim); margin-top: 4px;">识别到双方精灵后将自动计算面板、必杀与暗手愿力</div>
        </div>
    </div>
</div>

<script>
let folded = false;
const PVP_W = 360, H_EXPANDED = 540, H_FOLDED = 42;

// 属性映射
const ATTR_MAP = {
    "火": "fire.webp", "水": "water.webp", "草": "grass.webp", "电": "electric.webp", "冰": "ice.webp",
    "虫": "bug.webp", "翼": "flying.webp", "地": "ground.webp", "萌": "fairy.webp", "武": "fighting.webp",
    "毒": "poison.webp", "龙": "dragon.webp", "幽": "ghost.webp", "恶": "dark.webp", "光": "light.webp",
    "普通": "normal.webp", "机械": "steel.webp", "幻": "psychic.webp"
};

function getAttrIcon(attr) {
    if (!attr) return '';
    const clean = String(attr).replace('系', '').trim();
    const file = ATTR_MAP[clean] || ATTR_MAP[clean.toLowerCase()];
    return file ? `assets/img/icons/${file}` : '';
}

function getPetAvatar(name) {
    if (!name) return 'assets/img/icons/normal.webp';
    const map = window.PET_ASSET_MAP;
    if (!map) return 'assets/img/icons/normal.webp';

    const raw = String(name).trim();
    // 1. 直接精准匹配
    if (map[raw]) return `assets/img/pets/${map[raw]}`;

    // 2. 去除括号形态修饰（如 "白金独角兽（变体形态）" -> "白金独角兽"）
    const clean = raw.replace(/[\(（].*?[\)）]/g, '').trim();
    if (clean && map[clean]) return `assets/img/pets/${map[clean]}`;

    // 3. 数字编号匹配（如 117 或 #117）
    const numMatch = raw.match(/\d+/);
    if (numMatch) {
        const num = parseInt(numMatch[0], 10);
        const pad3 = String(num).padStart(3, '0');
        for (const [k, v] of Object.entries(map)) {
            if (v.startsWith(`${pad3}_`) || v.startsWith(`${num}_`)) {
                return `assets/img/pets/${v}`;
            }
        }
    }

    // 4. 模糊包含匹配
    for (const [k, v] of Object.entries(map)) {
        if (clean && (k.includes(clean) || clean.includes(k))) {
            return `assets/img/pets/${v}`;
        }
    }

    return 'assets/img/icons/normal.webp';
}

function getSkillIcon(name) {
    if (!name) return '';
    return `assets/img/skills/${encodeURIComponent(name.trim())}.webp`;
}

async function toggleFold() {
    folded = !folded;
    document.getElementById('pvpBody').style.display = folded ? 'none' : '';
    document.getElementById('foldBtn').textContent = folded ? '▴' : '▾';
    // 等布局完成再按内容真实尺寸同步(修 DPI 缩放截断)
    requestAnimationFrame(() => setTimeout(syncPvpSize, 30));
}

// 按内容真实尺寸同步窗口(乘 devicePixelRatio 换算物理像素)
function syncPvpSize() {
    const body = document.body;
    const dpr = window.devicePixelRatio || 1;
    const w = Math.ceil(Math.max(body.scrollWidth, PVP_W) * dpr);
    const h = Math.ceil(Math.max(body.scrollHeight, H_FOLDED) * dpr);
    if (window.pywebview && pywebview.api.pvp_float_resize) {
        pywebview.api.pvp_float_resize(w, h);
    }
}

// 初始尺寸校准(等 pywebview 桥就绪)
(function waitInit() {
    if (window.pywebview && pywebview.api && pywebview.api.pvp_float_resize) {
        setTimeout(syncPvpSize, 100);
    } else {
        setTimeout(waitInit, 300);
    }
})();

function updatePVPData(data) {
    // 内容高度随数据变化,渲染后自动校准窗口尺寸
    requestAnimationFrame(() => setTimeout(syncPvpSize, 50));
    const statusDot = document.getElementById('statusDot');
    const speedBadge = document.getElementById('speedBadge');
    const bodyEl = document.getElementById('pvpBody');

    if (!data || !data.in_battle) {
        statusDot.className = 'dot off';
        speedBadge.textContent = '--';
        speedBadge.className = 'speed-badge';
        return; // 保留上一次的推演内容不清空
        return;
    }

    statusDot.className = 'dot';
    const p = data.player || {}, e = data.enemy || {};

    // 速度判定
    const sd = data.speed_diff;
    const esr = data.enemy_speed_range;
    if (esr && esr.min && esr.max) {
        speedBadge.title = `敌方《洛克王国：世界》速度区间: ${esr.range_str} (满配极速: ${esr.max}, 减速0点: ${esr.min})`;
        if (sd !== undefined && sd !== null) {
            speedBadge.className = 'speed-badge ' + (sd > 0 ? 'fast' : sd < 0 ? 'slow' : '');
            speedBadge.textContent = (sd > 0 ? `⚡ 先手 +${sd}` : `🐢 后手 ${sd}`) + ` [${esr.range_str}]`;
        } else {
            speedBadge.textContent = `敌速 ${esr.range_str}`;
            speedBadge.className = 'speed-badge';
        }
    } else if (sd !== undefined && sd !== null) {
        speedBadge.textContent = sd > 0 ? `⚡ 先手 +${sd}` : sd < 0 ? `🐢 后手 ${sd}` : '= 平速';
        speedBadge.className = 'speed-badge ' + (sd > 0 ? 'fast' : sd < 0 ? 'slow' : '');
    } else {
        speedBadge.textContent = '--';
        speedBadge.className = 'speed-badge';
    }

    // 双方血量与属性
    const enemyHpPct = Math.round((e.hp_pct !== undefined ? e.hp_pct : 1.0) * 100);
    const enemyHpColor = enemyHpPct > 50 ? 'green' : enemyHpPct > 20 ? 'yellow' : 'red';

    const playerHp = p.hp || '?';
    const playerHpMax = p.hp_max || 450;
    const playerHpPct = typeof playerHp === 'number' ? Math.min(100, Math.round((playerHp / playerHpMax) * 100)) : 100;
    const playerHpColor = playerHpPct > 50 ? 'green' : playerHpPct > 20 ? 'yellow' : 'red';

    const playerAvatar = getPetAvatar(p.name);
    const enemyAvatar = getPetAvatar(e.name);

    const playerAttrIcons = (p.types || []).map(t => `<img class="attr-badge-img" src="${getAttrIcon(t)}" title="${t}">`).join('');
    const enemyAttrIcons = (e.types || []).map(t => `<img class="attr-badge-img" src="${getAttrIcon(t)}" title="${t}">`).join('');

    // 我方技能伤害推演
    let skillsHtml = '';
    if (data.calc_skills && data.calc_skills.length) {
        skillsHtml = data.calc_skills.map(s => {
            const isKill = s.is_kill;
            const dmgText = s.dmg_min > 0 ? `${s.dmg_min} ~ ${s.dmg_max}` : '状态/无伤';
            const multText = s.mult && s.mult > 1 ? `×${s.mult.toFixed(1)} 克制` : (s.mult && s.mult < 1 ? `×${s.mult.toFixed(1)} 抵抗` : '');
            const iconUrl = getSkillIcon(s.name);
            const typeBadge = s.type || '技能';

            return `
            <div class="skill-card ${isKill ? 'kill' : ''}">
                <img class="skill-icon" src="${iconUrl}" onerror="this.src='assets/img/icons/normal.webp'">
                <div class="skill-main">
                    <div class="skill-name-row">
                        <span class="skill-name">${s.name}</span>
                        <span class="skill-type-tag">${typeBadge}</span>
                    </div>
                </div>
                <div class="skill-dmg-box">
                    <div class="skill-dmg-num ${isKill ? 'kill' : ''}">${dmgText}</div>
                    ${multText ? `<div class="skill-mult">${multText}</div>` : ''}
                    ${isKill ? `<span class="kill-tag">必杀斩杀</span>` : ''}
                </div>
            </div>`;
        }).join('');
    }

    // 愿力冲击暗手伤害推演
    let resonanceHtml = '';
    if (data.resonance_impact && data.resonance_impact.cases) {
        const res = data.resonance_impact;
        const likelyIcons = (res.likely_counter_attrs || []).map(t => 
            `<span class="attr-pill"><img class="attr-pill-img" src="${getAttrIcon(t)}" alt="${t}"><span>${t}</span></span>`
        ).join(' ');

        const casesHtml = res.cases.map(c => {
            const isLethal = c.is_lethal;
            const badgeClass = c.id === '3x_no_counter' ? 'extreme' : (c.counter_mult > 1.0 ? 'warn' : '');
            const attrIconHtml = c.attr ? `<img class="attr-badge-img" src="${getAttrIcon(c.attr)}" title="${c.attr}" onerror="this.style.display='none'">` : '';
            return `
            <div class="res-case-card ${isLethal ? 'lethal' : ''}" title="${c.desc}">
                <div class="res-left">
                    ${attrIconHtml}
                    <span class="res-name">${c.name}</span>
                    <span class="res-tag ${badgeClass}">${c.badge}</span>
                </div>
                <div class="res-right">
                    <span class="res-dmg ${isLethal ? 'lethal' : ''}">${c.dmg_min} ~ ${c.dmg_max}</span>
                    ${isLethal ? `<span class="kill-tag" style="font-size:8.5px;">致死</span>` : ''}
                </div>
            </div>`;
        }).join('');

        resonanceHtml = `
        <div class="resonance-box">
            <div class="resonance-head">
                <span class="resonance-title">🔮 敌方暗手 · 愿力冲击推演 (80威力)</span>
                <span style="font-size:9.5px;color:var(--dim);">${res.atk_stat_name || '主攻'}</span>
            </div>
            ${likelyIcons ? `<div class="resonance-inferred"><span>🎯 预测反制愿力:</span> ${likelyIcons}</div>` : ''}
            <div class="resonance-cases-grid">
                ${casesHtml}
            </div>
        </div>`;
    }

    // 敌方常规威胁雷达与官方机制标签
    let threatsHtml = '';
    if (data.enemy_threats && data.enemy_threats.length) {
        threatsHtml = `
            <div class="sec-title">⚠️ 敌方技能池 & 机制预警</div>
            ${data.enemy_threats.map(t => {
                const isLethal = t.is_lethal;
                const iconUrl = getSkillIcon(t.name);
                const tagsHtml = (t.tags || []).map(tg => `<span class="res-tag" style="font-size:8.5px;padding:1px 4px;">${tg}</span>`).join(' ');
                return `
                <div class="threat-card ${isLethal ? 'lethal' : ''}">
                    <img class="skill-icon" style="width:20px;height:20px;" src="${iconUrl}" onerror="this.src='assets/img/icons/normal.webp'">
                    <div style="flex:1;display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                        <span class="threat-name">${t.name}</span>
                        ${tagsHtml}
                    </div>
                    <div class="threat-dmg">${t.dmg_min} ~ ${t.dmg_max}</div>
                    ${isLethal ? `<span class="kill-tag">致死预警</span>` : ''}
                </div>`;
            }).join('')}
        `;
    }

    bodyEl.innerHTML = `
        <!-- VS 看板 -->
        <div class="vs-banner">
            <div class="pet-side player">
                <div class="pet-header">
                    <img class="pet-avatar" src="${playerAvatar}" onerror="this.src='assets/img/icons/normal.webp'">
                    <div class="pet-info">
                        <div class="pet-name">${p.name || '我方精灵'}</div>
                        <div class="pet-attrs">${playerAttrIcons || '<span style="font-size:9.5px;color:var(--dim)">常规</span>'}</div>
                    </div>
                </div>
                <div class="stat-bar-box">
                    <div class="stat-nums">
                        <span style="color:var(--dim)">HP</span>
                        <span class="hp-val">${playerHp}</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${100 - playerHpPct}%"></div>
                    </div>
                </div>
                <div class="energy-row">
                    <span>能量</span>
                    <span class="energy-crystals">🔷 ${p.energy !== undefined ? p.energy : '?'}</span>
                </div>
            </div>

            <div class="vs-divider">
                <div class="vs-tag">VS</div>
            </div>

            <div class="pet-side enemy">
                <div class="pet-header">
                    <img class="pet-avatar" src="${enemyAvatar}" onerror="this.src='assets/img/icons/normal.webp'">
                    <div class="pet-info">
                        <div class="pet-name">${e.name || '敌方精灵'}</div>
                        <div class="pet-attrs">${enemyAttrIcons || '<span style="font-size:9.5px;color:var(--dim)">常规</span>'}</div>
                    </div>
                </div>
                <div class="stat-bar-box">
                    <div class="stat-nums">
                        <span class="hp-val">${enemyHpPct}%</span>
                        <span style="color:var(--dim)">HP</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${100 - enemyHpPct}%"></div>
                    </div>
                </div>
                <div class="energy-row" style="justify-content: flex-end;">
                    <span>目标</span>
                    <span style="color: #f87171; font-weight:700;">锁定中</span>
                </div>
            </div>
        </div>

        <!-- 愿力冲击暗手推演 -->
        ${resonanceHtml}

        <!-- 我方技能推演 -->
        <div class="sec-title">🎯 我方技能即时伤害推演</div>
        <div class="skills-grid">
            ${skillsHtml || '<div style="color:var(--dim);font-size:11px;padding:8px 0;text-align:center;">暂无技能推演数据</div>'}
        </div>

        <!-- 敌方常规威胁雷达 -->
        ${threatsHtml}
    `;
}
</script>
</body>
</html>
