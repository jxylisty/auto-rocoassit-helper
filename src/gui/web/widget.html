<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>状态悬浮窗</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg: rgba(8, 12, 24, 0.95);
        --border: rgba(255, 255, 255, 0.09);
        --text: #e3e7f0;
        --dim: #7880a0;
        --accent: #6366f1;
        --ok: #4ade80;
        --warn: #fbbf24;
        --err: #f87171;
        --cyan: #22d3ee;
        --radius: 12px;
    }
    html, body { background: transparent; }
    body {
        font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        color: var(--text); overflow: hidden;
        -webkit-user-select: none; user-select: none;
        -webkit-font-smoothing: antialiased;
    }
    .card {
        background: var(--bg); border: 1px solid var(--border);
        border-radius: var(--radius); backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow: 0 8px 36px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04);
        overflow: hidden;
        transition: box-shadow 0.3s ease;
    }
    .card:hover {
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    /* 头部 */
    .head {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 14px; cursor: default;
        border-bottom: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.15);
    }
    .dot {
        width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
        background: #555c6e; transition: all 0.3s ease;
    }
    .dot.run { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 1.5s infinite; }
    .dot.throwing { background: var(--warn); box-shadow: 0 0 10px var(--warn); animation: pulse 0.8s infinite; }
    .dot.paused { background: var(--err); box-shadow: 0 0 10px var(--err); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    .title {
        font-size: 13px; font-weight: 700; flex: 1;
        letter-spacing: 0.5px; line-height: 1.2;
    }
    .title small {
        color: var(--dim); font-weight: 400;
        margin-left: 6px; font-size: 10px;
    }
    .fold-btn {
        background: none; border: 1px solid var(--border);
        color: var(--dim); width: 24px; height: 24px;
        border-radius: 6px; cursor: pointer; font-size: 11px;
        line-height: 1; display: flex; align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }
    .fold-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(99, 102, 241, 0.1); }

    /* 主体 */
    .body { padding: 12px 14px 14px; }
    .row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 5px 0; font-size: 12px;
    }
    .row .k { color: var(--dim); }
    .row .v {
        font-weight: 700; font-variant-numeric: tabular-nums;
        transition: color 0.3s ease;
    }
    .v.ok { color: var(--cyan); }
    .v.warn { color: var(--warn); }
    .divider {
        height: 1px; background: var(--border);
        margin: 8px 0;
    }

    /* 敌方血量专用大块展示 */
    .enemy-card {
        margin: 2px 0 4px; padding: 10px 12px;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(248,113,113,0.08), rgba(251,191,36,0.05));
        border: 1px solid rgba(248, 113, 113, 0.22);
    }
    .enemy-card .enemy-name {
        font-size: 15px; font-weight: 700; color: #fca5a5;
        margin-bottom: 8px; letter-spacing: 0.5px;
        display: flex; align-items: center; gap: 6px;
    }
    .enemy-card .enemy-name .tag {
        font-size: 9px; font-weight: 400; color: var(--dim);
        border: 1px solid var(--border); border-radius: 4px;
        padding: 1px 5px; letter-spacing: 0;
    }
    .enemy-card .enemy-name.none { color: #555c6e; font-weight: 400; }
    .hpbar-wrap { display: flex; align-items: center; gap: 10px; }
    .hpbar {
        flex: 1; height: 10px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden; position: relative;
    }
    .hpbar-fill {
        height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #4ade80, #a3e635);
        width: 0%; transition: width 0.45s cubic-bezier(.4,0,.2,1), background 0.3s ease;
    }
    .hpbar-fill.mid { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    .hpbar-fill.low { background: linear-gradient(90deg, #f87171, #ef4444); }
    .hp-num {
        font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums;
        color: var(--text); min-width: 64px; text-align: right;
        line-height: 1;
    }
    .hp-num span { font-size: 11px; color: var(--dim); font-weight: 400; }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .chip {
        font-size: 10px; padding: 3px 10px; border-radius: 999px;
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(99, 102, 241, 0.4);
        color: #c7cdf9;
        transition: all 0.2s ease;
    }
    .chip.none {
        background: none; border-color: var(--border);
        color: #555c6e;
    }
    .game {
        margin-top: 9px; font-size: 10px; color: var(--dim);
        display: flex; align-items: center; gap: 6px;
        padding: 4px 8px; border-radius: 6px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        transition: all 0.3s ease;
    }
    .game i {
        width: 6px; height: 6px; border-radius: 50%;
        background: #555c6e; flex-shrink: 0;
        transition: all 0.3s ease;
    }
    .game.on {
        color: var(--ok);
        border-color: rgba(74, 222, 128, 0.25);
        background: rgba(74, 222, 128, 0.05);
    }
    .game.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
</style>
</head>
<body>
<div class="card" id="card">
    <div class="head" id="head">
        <span class="dot" id="dot"></span>
        <span class="title" id="title">待机<small id="subtitle"></small></span>
        <button class="fold-btn" id="foldBtn" onclick="toggleFold()">▾</button>
    </div>
    <div class="body" id="body">
        <div class="row"><span class="k">挂机状态</span><span class="v" id="wState">停止</span></div>
        <div class="row"><span class="k">状态详情</span><span class="v" id="wDetail" style="font-weight:400;color:#9aa3b8">—</span></div>
        <div class="divider"></div>
        <div class="enemy-card">
            <div class="enemy-name none" id="wEnemyNameCard"><span class="tag">敌方</span><span id="wEnemyName">未在战斗</span></div>
            <div class="hpbar-wrap">
                <div class="hpbar"><div class="hpbar-fill" id="wEnemyHpBar"></div></div>
                <div class="hp-num" id="wEnemyHpNum">--<span>%</span></div>
            </div>
        </div>
        <div class="row"><span class="k">完成战斗</span><span class="v ok" id="wBattles">0</span></div>
        <div class="row"><span class="k">丢球 / 捕获</span><span class="v warn" id="wBalls">0 / 0</span></div>
        <div class="divider"></div>
        <div class="chips" id="wChips"><span class="chip none">全部空闲</span></div>
        <div class="game" id="wGame"><i></i><span>游戏窗口后台</span></div>
    </div>
</div>
<script>
    const $ = id => document.getElementById(id);
    let folded = false;
    const H_EXPANDED = 300, H_FOLDED = 40;

    const STATE_TXT = { stopped: '停止', waiting: '巡逻找怪', fighting: '战斗中', throwing: '丢球中', paused: '暂停' };

    async function toggleFold() {
        folded = !folded;
        $('body').style.display = folded ? 'none' : '';
        $('foldBtn').textContent = folded ? '▴' : '▾';
        try { await pywebview.api.widget_resize(folded ? H_FOLDED : H_EXPANDED); } catch (e) {}
    }

    function setHp(pct) {
        const bar = $('wEnemyHpBar'), num = $('wEnemyHpNum');
        if (pct == null) {
            bar.style.width = '0%';
            bar.className = 'hpbar-fill';
            num.innerHTML = '--<span>%</span>';
            return;
        }
        const v = Math.max(0, Math.min(100, pct));
        bar.style.width = v + '%';
        bar.className = 'hpbar-fill' + (v <= 20 ? ' low' : v <= 50 ? ' mid' : '');
        num.innerHTML = v + '<span>%</span>';
    }

    async function tick() {
        try {
            const s = await pywebview.api.get_state();
            const e = await pywebview.api.engine_status();

            const state = e.running ? e.state : 'stopped';
            const dot = $('dot');
            dot.className = 'dot' + (e.running
                ? ({ throwing: ' throwing', paused: ' paused' }[e.state] || ' run')
                : '');
            $('title').childNodes[0].textContent = e.running ? (STATE_TXT[e.state] || e.state) : '待机';
            $('subtitle').textContent = e.dry_run ? '模拟' : '';

            $('wState').textContent = STATE_TXT[state] || state;
            $('wDetail').textContent = e.detail || '—';
            $('wBattles').textContent = e.battles_done ?? 0;
            $('wBalls').textContent = `${e.catch_attempts ?? 0} / ${e.catches ?? 0}`;

            // 敌方卡片
            const nameCard = $('wEnemyNameCard');
            const hasName = !!(e.enemy_name && e.enemy_name !== '?');
            nameCard.className = 'enemy-name' + (hasName ? '' : ' none');
            $('wEnemyName').textContent = hasName ? e.enemy_name : (e.running ? '识别中…' : '未在战斗');
            setHp(e.enemy_hp != null ? e.enemy_hp : null);

            const chips = [];
            (s.tasks || []).forEach(t => chips.push(`<span class="chip">${t.name}</span>`));
            $('wChips').innerHTML = chips.length ? chips.join('') : '<span class="chip none">全部空闲</span>';

            $('wGame').className = 'game' + (s.game_active ? ' on' : '');
            $('wGame').querySelector('span').textContent = s.game_active ? '游戏窗口前台' : '游戏窗口后台';
        } catch (err) { /* 后端未就绪 */ }
    }

    window.addEventListener('pywebviewready', () => { tick(); setInterval(tick, 1000); });
</script>
</body>
</html>
