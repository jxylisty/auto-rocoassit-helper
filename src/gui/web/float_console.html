    html, body { background: #0a0e1a !important; }

    /* ============ 魔法绘本皮肤 V4.5 (换肤不换骨: DOM/JS 合约原样) ============ */
    :root {
        --paper: #f6efdc;          /* 书页黄 */
        --card-bg: rgba(252, 247, 234, 0.97);
        --card-edge: #c8b482;      /* 金棕描边 */
        --line: #dccfa8;
        --ink-1: #3f3428;          /* 棕墨主字 */
        --ink-2: #655741;
        --ink-3: #8a7a5e;
        --gold: #8a6420;           /* 鎏金强调 */
        --gold-soft: rgba(138, 100, 32, 0.12);
        --cover: #332a1d;          /* 书脊深棕 */
        --foil: #e6c46a;
        --leaf: #4f7a4a;           /* 叶绿 = 正常/成功 */
        --wax: #a8402f;            /* 火漆红 = 战斗/危险 */
        --wax-soft: rgba(168, 64, 47, 0.12);
        --teal: #3d6b5c;
        --num-font: Consolas, 'Cascadia Mono', monospace;
        --text: #3f3428;          /* 主文字 */
        --bg: rgba(252, 247, 234, 0.97);    /* 卡片背景 */
        --border: #dccfa8;         /* 边框 */
        --radius: 12px;            /* 圆角 */
        --dim: #8a7a5e;            /* 暗色文字 */
        --accent: #8a6420;         /* 强调色 */
        --ok: #4f7a4a;             /* 成功/正常 */
        --warn: #b07d1e;           /* 警告 */
        --err: #a8402f;            /* 错误 */
    }
    html, body {
        background: transparent;
        width: 100%; height: 100%;
        overflow: hidden;
    }
    body {
        font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: var(--text); user-select: none; font-size: 12px;
    }
    .card {
        width: 100%;
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 12px; backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        overflow: hidden;
    }
    .head {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        cursor: move;
        height: 42px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .dot.run { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.5s infinite; }
    .dot.throwing { background: var(--warn); box-shadow: 0 0 10px var(--warn); animation: pulse 0.8s infinite; }
    .dot.fleeing { background: var(--err); box-shadow: 0 0 10px var(--err); animation: pulse 0.5s infinite; }
    .dot.fled { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
    .dot.paused { background: var(--warn); }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.15); } }

    .title { font-size: 13px; font-weight: 700; flex: 1; letter-spacing: 0.3px; }
    .title small { font-size: 10.5px; color: var(--warn); font-weight: 400; margin-left: 4px; }
    .fold-btn {
        background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
        color: var(--dim); width: 22px; height: 22px;
        border-radius: 6px; cursor: pointer; font-size: 11px;
        line-height: 1; display: flex; align-items: center;
        justify-content: center;

    .fold-btn:hover { color: var(--text); border-color: var(--accent); }

    .body { padding: 10px 12px; }

        /* ===== 合并版: 标签页 + PVP 引擎开关 ===== */

    .body { padding: 9px 12px; }

    .hpbar { background: #e7dbba; border: 1px solid var(--line); }

    /* ---------- PVP tab · 绘本化 ---------- */
    .pv-root .pv-status-row { color: var(--ink-2); }

    .pv-root .bar-fill { background: rgba(63, 52, 40, 0.55); }
    .pv-root .sec-title { color: var(--ink-3); letter-spacing: 0.08em; }
    .pv-root .skill-card { background: #f7f0da; border: 1px solid var(--line); }
    .pv-root .skill-card:hover { background: #fdf9ee; border-color: var(--card-edge); }
    .pv-root .skill-card.kill { background: linear-gradient(90deg, rgba(168,64,47,0.14), rgba(176,125,30,0.10)); border-color: rgba(168,64,47,0.5); box-shadow: none; }
    .pv-root .skill-icon { background: #fffdf6; border: 1px solid var(--line); }
    .pv-root .skill-name { color: var(--ink-1); }
    .pv-root .skill-type-tag { background: #efe5c8; color: var(--ink-2); }
    .pv-root .skill-dmg-num { color: var(--teal); }
    .pv-root .skill-dmg-num.kill { color: var(--wax); }
    .pv-root .skill-mult { color: var(--leaf); }
    .kill-tag { background: var(--wax); }
    .pv-root .energy-crystals { color: var(--teal); }

    .pv-root .resonance-box { background: rgba(138, 100, 32, 0.07); border: 1px solid rgba(138, 100, 32, 0.3); }
    .pv-root .resonance-title { color: var(--gold); }
    .pv-root .resonance-inferred { background: #f3ead0; color: var(--ink-2); }
    .pv-root .attr-pill { background: #fffdf6; border: 1px solid var(--line); color: var(--ink-1); }
    .pv-root .res-case-card { background: #f7f0da; border: 1px solid var(--line); }
    .pv-root .res-case-card.lethal { background: rgba(168,64,47,0.12); border-color: rgba(168,64,47,0.45); }
    .pv-root .res-name { color: var(--ink-1); }
    .pv-root .res-tag { background: var(--gold-soft); color: var(--gold); }
    .pv-root .res-tag.warn { background: rgba(176,125,30,0.18); color: #8a6410; }
    .pv-root .res-tag.extreme { background: rgba(168,64,47,0.2); color: var(--wax); }
    .pv-root .res-dmg { color: var(--teal); }
    .pv-root .res-dmg.lethal { color: var(--wax); }
    .pv-root .threat-card { background: rgba(168,64,47,0.06); border: 1px solid rgba(168,64,47,0.2); }
    .pv-root .threat-card.lethal { border-color: rgba(168,64,47,0.5); background: rgba(168,64,47,0.14); }
    .pv-root .threat-name { color: var(--wax); }
    .pv-root .threat-dmg { color: var(--wax); }
</style>
</head>
<body>
<div class="card" id="card">
    <div class="head" id="head" title="按住拖动窗口">
        <span class="dot" id="dot"></span>
        <span class="title" id="title">待机<small id="subtitle"></small></span>
        <button class="fold-btn" id="foldBtn" onclick="toggleFold()" title="折叠/展开">▾</button>
    </div>
    <div class="tabs-bar" id="tabsBar">
        <button class="tab-btn active" id="tabAfk" onclick="switchTab('afk')">🎯 挂机</button>
        <button class="tab-btn" id="tabPvp" onclick="switchTab('pvp')">⚔️ PVP</button>
    </div>
    <div class="body" id="wBody">
        <div class="row"><span class="k">运行状态</span><span class="v accent" id="wState">停止</span></div>
        <div class="row"><span class="k">实时详情</span><span class="v" id="wDetail" style="font-weight:400;color:#94a3b8;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">—</span></div>
        <div class="divider"></div>

        <!-- 敌方战情卡片 -->
        <div class="enemy-card" id="wEnemyCard">
            <div class="enemy-avatar-box">
                <div class="idle-badge" id="wIdleBadge">🎯</div>
                <img class="enemy-avatar" id="wEnemyAvatar" style="display:none;" src="" alt="" onerror="this.style.display='none'">
            </div>
            <div class="enemy-detail">
                <div class="enemy-name-row">
                    <span class="enemy-name none" id="wEnemyName">未在战斗</span>
                    <span class="enemy-tag" id="wEnemyTag">待命中</span>
                </div>
                <div class="hpbar-wrap">
                    <div class="hpbar"><div class="hpbar-fill" id="wEnemyHpBar"></div></div>
                    <div class="hp-num" id="wEnemyHpNum">--<span>%</span></div>
                </div>
            </div>
        </div>

        <div class="row"><span class="k">战斗 / 逃跑</span><span class="v ok" id="wBattles">0</span></div>
        <div class="row"><span class="k">丢球 / 捕获</span><span class="v warn" id="wBalls">0 / 0</span></div>
        <div class="divider"></div>
        <div class="chips" id="wChips"><span class="chip none">全部空闲</span></div>
        <div class="game" id="wGame"><i></i><span>游戏窗口后台</span></div>
    </div>

        <div id="pvRoot" style="display:none" class="pv-root">
            <div class="pv-status-row">
                <div class="pv-dot off" id="statusDot"></div>
                <span style="font-size:11px;color:var(--dim);flex:1;">PVP 实时推演</span>
                <div class="speed-badge" id="speedBadge">--</div>
            </div>
            <div class="pv-engine-row">
                <button class="pv-engine-btn" id="pvEngineBtn" onclick="pvEngineToggle()">▶ 启动识别</button>
                <span style="font-size:10px;color:#555c6e;" id="pvEngineHint">需先在主控台 PVP 页确认配置</span>
            </div>
            <div id="pvpBody">
                <div class="empty-state">
                    <div style="font-size: 24px; margin-bottom: 8px;">⚔️</div>
                    <div>等待进入 PVP 对战画面…</div>
                    <div style="font-size: 10px; color: var(--dim); margin-top: 4px;">点上方「启动识别」开始监视</div>
                </div>
            </div>
        </div>
</div>
<script>
    const $ = id => document.getElementById(id);
    let folded = false;
    const W_WIDTH = 340, H_EXPANDED = 350, H_FOLDED = 42;

    const STATE_TXT = {
        stopped: '停止',
        waiting: '巡逻找怪',
        fighting: '战斗中',
        throwing: '丢球中',
        fleeing: '遭遇战斗·逃跑中',
        fled: '已脱离战斗',
        paused: '暂停'
    };

    function getPetAvatar(name) {
        if (!name || name === '?' || name === '未在战斗' || name === '遭遇精灵') return '';
        const map = window.PET_ASSET_MAP;
        if (!map) return '';

        const raw = String(name).trim();
        // 1. 直接精准匹配
        if (map[raw]) return `assets/img/pets/${map[raw]}`;

        // 2. 去除括号形态修饰（如 "白金独角兽（变体形态）" -> "白金独角兽"）
        const clean = raw.replace(/[\(（].*?[\)）]/g, '').trim();
        if (clean && map[clean]) return `assets/img/pets/${map[clean]}`;

        // 3. 数字编号匹配（如 117 或 #117）
        const numMatch = raw.match(/\d+/);
        if (numMatch) {
            const num = parseInt(numMatch[0], 10);
            const pad3 = String(num).padStart(3, '0');
            for (const [k, v] of Object.entries(map)) {
                if (v.startsWith(`${pad3}_`) || v.startsWith(`${num}_`)) {
                    return `assets/img/pets/${v}`;
                }
            }
        }

        // 4. 模糊包含匹配
        for (const [k, v] of Object.entries(map)) {
            if (clean && (k.includes(clean) || clean.includes(k))) {
                return `assets/img/pets/${v}`;
            }
        }

        return '';
    }

    // 按内容真实高度同步窗口尺寸(乘 devicePixelRatio 换算物理像素,修复 DPI 缩放下折叠变形)
    function syncSize() {
        const card = document.getElementById('card');
        if (!card || !window.pywebview || !pywebview.api.widget_resize) return;
        const dpr = window.devicePixelRatio || 1;
        const w = Math.ceil(Math.max(card.offsetWidth, document.body.scrollWidth) * dpr);
        const h = Math.ceil(Math.max(card.offsetHeight, document.body.scrollHeight) * dpr);
        pywebview.api.widget_resize(w, h);
    }

    async function toggleFold() {
        folded = !folded;
        $('wBody').style.display = folded ? 'none' : '';
        $('foldBtn').textContent = folded ? '▴' : '▾';
        try { await pywebview.api.widget_set_folded(folded); } catch (e) {}
        // 等布局完成再量尺寸
        requestAnimationFrame(() => setTimeout(syncSize, 30));
    }

    function setHp(pct) {
        const bar = $('wEnemyHpBar'), num = $('wEnemyHpNum');
        if (pct == null) {
            bar.style.width = '0%';
            bar.className = 'hpbar-fill';
            num.innerHTML = '--<span>%</span>';
            return;
        }
        const v = Math.max(0, Math.min(100, pct));
        bar.style.width = (100 - v) + '%';
        bar.className = 'hpbar-fill' + (v <= 20 ? ' low' : v <= 50 ? ' mid' : '');
        num.innerHTML = v + '<span>%</span>';
    }

    async function tick() {
        try {
            if (!window.pywebview || !pywebview.api) return;
            const s = await pywebview.api.get_state();
            const e = await pywebview.api.engine_status();

            const isRunning = !!e.running;
            const stateKey = isRunning ? (e.state || 'running') : 'stopped';
            const dot = $('dot');

            let dotClass = 'dot';
            if (isRunning) {
                if (stateKey === 'fleeing') dotClass += ' fleeing';
                else if (stateKey === 'throwing') dotClass += ' throwing';
                else if (stateKey === 'fled') dotClass += ' fled';
                else if (stateKey === 'paused') dotClass += ' paused';
                else dotClass += ' run';
            }
            dot.className = dotClass;

            $('title').childNodes[0].textContent = isRunning ? (STATE_TXT[stateKey] || stateKey) : '待机';
            $('subtitle').textContent = e.dry_run ? ' (模拟)' : '';

            $('wState').textContent = STATE_TXT[stateKey] || stateKey;
            $('wDetail').textContent = e.detail || '—';
            $('wDetail').title = e.detail || '';
            $('wBattles').textContent = e.battles_done ?? 0;
            
            if (e.mode_type === 'tool') {
                $('wBalls').textContent = `${e.catch_attempts ?? 0} 球`;
            } else {
                $('wBalls').textContent = `${e.catch_attempts ?? 0} / ${e.catches ?? 0}`;
            }

            // 敌方战情卡片展示
            const enemyName = e.enemy_name;
            const watching = !!e.watching;  // 观察模式: 引擎没跑也监视到了战斗
            const inBattle = !!(enemyName && enemyName !== '?' && enemyName !== 'None') || watching;
            const enemyCard = $('wEnemyCard');
            const idleBadge = $('wIdleBadge');
            const enemyAvatar = $('wEnemyAvatar');
            const enemyTag = $('wEnemyTag');

            if (inBattle) {
                enemyCard.className = 'enemy-card in-battle';
                $('wEnemyName').className = 'enemy-name';
                $('wEnemyName').textContent = enemyName;
                enemyTag.className = 'enemy-tag battle';
                enemyTag.textContent = stateKey === 'fleeing' ? '遭遇对战' : '战斗中';

                const avatarUrl = getPetAvatar(enemyName);
                if (avatarUrl) {
                    enemyAvatar.src = avatarUrl;
                    enemyAvatar.style.display = 'block';
                    idleBadge.style.display = 'none';
                } else {
                    enemyAvatar.style.display = 'none';
                    idleBadge.textContent = '⚔️';
                    idleBadge.style.display = 'flex';
                }
                setHp(e.enemy_hp != null ? e.enemy_hp : (watching ? 100 : null));
            } else {
                enemyCard.className = 'enemy-card';
                $('wEnemyName').className = 'enemy-name none';
                $('wEnemyName').textContent = watching ? '战斗识别中…'
                    : (isRunning ? (stateKey === 'fled' ? '战斗已脱离' : '巡逻/丢球中') : '未在战斗');
                enemyTag.className = 'enemy-tag';
                enemyTag.textContent = watching ? '观察中' : (isRunning ? '待命中' : '空闲');

                enemyAvatar.style.display = 'none';
                idleBadge.textContent = watching ? '👁' : (isRunning ? (stateKey === 'fled' ? '✨' : '🎯') : '💤');
                idleBadge.style.display = 'flex';
                setHp(null);
            }

            // 任务列表
            const chips = [];
            (s.tasks || []).forEach(t => chips.push(`<span class="chip">${t.name}</span>`));
            $('wChips').innerHTML = chips.length ? chips.join('') : '<span class="chip none">全部空闲</span>';

            // 游戏前台/后台状态
            $('wGame').className = 'game' + (s.game_active ? ' on' : '');
            $('wGame').querySelector('span').textContent = s.game_active ? '游戏窗口前台' : '游戏窗口后台';
        } catch (err) { /* 后端未就绪，静默 */ }
    }

    window.addEventListener('pywebviewready', async () => {
        // 应用上次记住的折叠偏好
        try {
            const st = await pywebview.api.widget_get_state();
            if (st.folded && !folded) await toggleFold();
        } catch (e) {}
        syncSize();  // 初始就按内容真实尺寸校准(修 DPI 缩放偏差)
        tick();
        setInterval(tick, 400);
    });
</script>
<script>
const ATTR_MAP = {
    "火": "fire.webp", "水": "water.webp", "草": "grass.webp", "电": "electric.webp", "冰": "ice.webp",
    "虫": "bug.webp", "翼": "flying.webp", "地": "ground.webp", "萌": "fairy.webp", "武": "fighting.webp",
    "毒": "poison.webp", "龙": "dragon.webp", "幽": "ghost.webp", "恶": "dark.webp", "光": "light.webp",
    "普通": "normal.webp", "机械": "steel.webp", "幻": "psychic.webp"
};

function getAttrIcon(attr) {
    if (!attr) return '';
    const clean = String(attr).replace('系', '').trim();
    const file = ATTR_MAP[clean] || ATTR_MAP[clean.toLowerCase()];
    return file ? `assets/img/icons/${file}` : '';
}

function pvGetPetAvatar(name) {
    if (!name) return 'assets/img/icons/normal.webp';
    const map = window.PET_ASSET_MAP;
    if (!map) return 'assets/img/icons/normal.webp';

    const raw = String(name).trim();
    // 1. 直接精准匹配
    if (map[raw]) return `assets/img/pets/${map[raw]}`;

    // 2. 去除括号形态修饰（如 "白金独角兽（变体形态）" -> "白金独角兽"）
    const clean = raw.replace(/[\(（].*?[\)）]/g, '').trim();
    if (clean && map[clean]) return `assets/img/pets/${map[clean]}`;

    // 3. 数字编号匹配（如 117 或 #117）
    const numMatch = raw.match(/\d+/);
    if (numMatch) {
        const num = parseInt(numMatch[0], 10);
        const pad3 = String(num).padStart(3, '0');
        for (const [k, v] of Object.entries(map)) {
            if (v.startsWith(`${pad3}_`) || v.startsWith(`${num}_`)) {
                return `assets/img/pets/${v}`;
            }
        }
    }

    // 4. 模糊包含匹配
    for (const [k, v] of Object.entries(map)) {
        if (clean && (k.includes(clean) || clean.includes(k))) {
            return `assets/img/pets/${v}`;
        }
    }

    return 'assets/img/icons/normal.webp';
}

function getSkillIcon(name) {
    if (!name) return '';
    return `assets/img/skills/${encodeURIComponent(name.trim())}.webp`;
}




    // ===== 合并版: 标签切换 =====
    let activeTab = 'afk';
    function switchTab(tab) {
        activeTab = tab;
        $('wBody').style.display = tab === 'afk' ? '' : 'none';
        $('pvRoot').style.display = tab === 'pvp' ? '' : 'none';
        $('tabAfk').classList.toggle('active', tab === 'afk');
        $('tabPvp').classList.toggle('active', tab === 'pvp');
        requestAnimationFrame(() => setTimeout(syncSize, 30));
    }

    // ===== PVP 识别引擎开关(悬浮窗直达) =====
    let pvEngineOn = false;
    async function pvEngineToggle() {
        try {
            if (pvEngineOn) await pywebview.api.pvp_engine_stop();
            else await pywebview.api.pvp_engine_start();
        } catch (e) {}
        refreshPvEngine();
    }
    async function refreshPvEngine() {
        if (!window.pywebview || !pywebview.api.pvp_engine_status) return;
        try {
            const s = await pywebview.api.pvp_engine_status();
            pvEngineOn = !!s.running;
            const btn = $('pvEngineBtn');
            if (btn) {
                btn.textContent = pvEngineOn ? '■ 停止识别' : '▶ 启动识别';
                btn.classList.toggle('on', pvEngineOn);
            }
        } catch (e) {}
    }
    setInterval(refreshPvEngine, 2000);

    // ===== 自研拖拽: 整个标题栏/标签栏按住即可拖动(按钮正常点击,不依赖 pywebview 拖拽区/窗口焦点) =====
    (function initDrag() {
        let dragging = false, lx = 0, ly = 0, px = 0, py = 0, raf = 0;
        function bind() {
            const targets = document.querySelectorAll('#head, #tabsBar');
            if (!targets.length) { setTimeout(bind, 300); return; }
            targets.forEach(el => el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                if (e.target.closest('button')) return;   // 按钮点击不触发拖动
                dragging = true;
                lx = e.screenX; ly = e.screenY; px = py = 0;
                e.preventDefault();
            }));
            window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                px += e.screenX - lx; py += e.screenY - ly;
                lx = e.screenX; ly = e.screenY;
                if (!raf) raf = requestAnimationFrame(flush);
            });
            window.addEventListener('mouseup', () => {
                if (dragging) { flush(); dragging = false; }
            });
        }
        function flush() {
            raf = 0;
            if ((px || py) && window.pywebview && pywebview.api.move_window_by) {
                pywebview.api.move_window_by(Math.round(px), Math.round(py));
                px = py = 0;
            }
        }
        bind();
    })();
</script>
