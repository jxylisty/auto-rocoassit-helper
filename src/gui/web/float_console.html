<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>挂机悬浮战情</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="assets/pet_asset_map.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* ============ 魔法绘本皮肤 V4.5 (换肤不换骨: DOM/JS 合约原样) ============ */
    :root {
        --paper: #f6efdc;          /* 书页黄 */
        --card-bg: rgba(252, 247, 234, 0.97);
        --card-edge: #c8b482;      /* 金棕描边 */
        --line: #dccfa8;
        --ink-1: #3f3428;          /* 棕墨主字 */
        --ink-2: #655741;
        --ink-3: #8a7a5e;
        --gold: #8a6420;           /* 鎏金强调 */
        --gold-soft: rgba(138, 100, 32, 0.12);
        --cover: #332a1d;          /* 书脊深棕 */
        --foil: #e6c46a;
        --leaf: #4f7a4a;           /* 叶绿 = 正常/成功 */
        --wax: #a8402f;            /* 火漆红 = 战斗/危险 */
        --wax-soft: rgba(168, 64, 47, 0.12);
        --teal: #3d6b5c;
        --num-font: Consolas, 'Cascadia Mono', monospace;
        --text: #3f3428;          /* 主文字 */
        --bg: rgba(252, 247, 234, 0.97);    /* 卡片背景 */
        --border: #dccfa8;         /* 边框 */
        --radius: 12px;            /* 圆角 */
        --dim: #8a7a5e;            /* 暗色文字 */
        --accent: #8a6420;         /* 强调色 */
        --ok: #4f7a4a;             /* 成功/正常 */
        --warn: #b07d1e;           /* 警告 */
        --err: #a8402f;            /* 错误 */
    }
    html, body {
        background: transparent;
        width: 100%; height: 100%;
        overflow: hidden;
    }
    body {
        font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: var(--text); user-select: none; font-size: 12px;
    }
    .card {
        width: 100%;
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 12px; backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        overflow: hidden;
    }
    .head {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        cursor: move;
        height: 42px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .dot.run { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.5s infinite; }
    .dot.throwing { background: var(--warn); box-shadow: 0 0 10px var(--warn); animation: pulse 0.8s infinite; }
    .dot.fleeing { background: var(--err); box-shadow: 0 0 10px var(--err); animation: pulse 0.5s infinite; }
    .dot.fled { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
    .dot.paused { background: var(--warn); }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.15); } }

    .title { font-size: 13px; font-weight: 700; flex: 1; letter-spacing: 0.3px; }
    .title small { font-size: 10.5px; color: var(--warn); font-weight: 400; margin-left: 4px; }
    .fold-btn {
        background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
        color: var(--dim); width: 22px; height: 22px;
        border-radius: 6px; cursor: pointer; font-size: 11px;
        line-height: 1; display: flex; align-items: center;
        justify-content: center;
    }
    .fold-btn:hover { color: var(--text); border-color: var(--accent); }

    .body { padding: 10px 12px; }
    .row {
        display: flex; justify-content: space-between;
        align-items: center; margin-bottom: 6px;
        font-size: 12px;
    }
    .row:last-child { margin-bottom: 0; }
    .k { color: var(--dim); }
    .v { font-weight: 700; font-variant-numeric: tabular-nums; }
    .v.ok { color: var(--ok); }
    .v.warn { color: var(--warn); }
    .v.err { color: var(--err); }
    .v.accent { color: #818cf8; }

    .divider { height: 1px; background: var(--border); margin: 8px 0; }

    /* 敌方战情卡片 */
    .enemy-card {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 10px; border-radius: 8px;
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(99, 102, 241, 0.06));
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 8px;
    }
    .enemy-card.in-battle {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(245, 158, 11, 0.1));
        border-color: rgba(239, 68, 68, 0.35);
    }
    .enemy-avatar-box {
        position: relative; width: 34px; height: 34px; flex-shrink: 0;
        border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex; align-items: center; justify-content: center;
    }
    .idle-badge {
        font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .enemy-avatar {
        width: 100%; height: 100%; object-fit: cover;
    }
    .enemy-attr-icon {
        position: absolute; bottom: 0; right: 0; width: 13px; height: 13px;
        background: rgba(0,0,0,0.6); border-radius: 3px;
    }
    .enemy-detail {
        flex: 1; min-width: 0;
    }
    .enemy-name-row {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px;
    }
    .enemy-name {
        font-size: 12px; font-weight: 700; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .enemy-name.none { color: var(--dim); font-weight: 500; }
    .enemy-tag {
        font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 3px;
        background: rgba(255, 255, 255, 0.08); color: var(--dim);
    }
    .enemy-tag.battle {
        background: rgba(239, 68, 68, 0.2); color: #fca5a5;
    }

    .hpbar-wrap {
        display: flex; align-items: center; gap: 6px;
    }
    .hpbar { height: 6px; border-radius: 999px; overflow: hidden; background: linear-gradient(90deg, #22c55e, #eab308 55%, #ef4444); }
    .hpbar-fill { height: 100%; border-radius: 0 999px 999px 0; margin-left: auto; background: rgba(8, 12, 22, 0.82); transition: width 0.45s ease; }
    .hpbar-fill.mid { background: linear-gradient(90deg, #eab308, #facc15); }
    .hpbar-fill.low ~ .hp-num { background: linear-gradient(90deg, #ef4444, #f87171); }
    .hp-num {
        font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums;
        color: #38bdf8; min-width: 32px; text-align: right;
    }
    .hp-num span { font-size: 8.5px; color: var(--dim); font-weight: 400; margin-left: 1px; }

    .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .chip {
        font-size: 10px; padding: 2px 6px; border-radius: 4px;
        background: rgba(99, 102, 241, 0.15); color: #c7cdf9;
        border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .chip.none {
        background: rgba(255, 255, 255, 0.03); color: var(--dim);
        border-color: rgba(255, 255, 255, 0.06);
    }

    .game {
        display: flex; align-items: center; gap: 5px;
        font-size: 10.5px; color: var(--dim); margin-top: 6px;
        padding-top: 6px; border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .game i {
        width: 6px; height: 6px; border-radius: 50%; background: #64748b;
    }
    .game.on {
        color: var(--ok);
    }
    .game.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

    /* ---------- 悬浮战情卡 · 绘本化 ---------- */
    .card {
        background: var(--card-bg);
        border: 1px solid var(--card-edge);
        box-shadow: 0 6px 24px rgba(70, 52, 24, 0.35), 0 0 0 3px rgba(51, 42, 29, 0.85);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
    }
    .head {
        background: linear-gradient(180deg, #3a3021, #2e2618);
        border-bottom: 2px solid #211a10;
        border-radius: 10px 10px 0 0;
    }
    .title { color: #f4e8c8; font-family: 'KaiTi','STKaiti','楷体',serif; font-size: 13px; letter-spacing: 0.05em; }
    .title small { color: #b3a175; }
    .fold-btn { background: rgba(230,196,106,0.1); border: 1px solid rgba(230,196,106,0.25); color: #e6c46a; }
    .fold-btn:hover { background: rgba(230,196,106,0.22); }
    .dot { background: #8a7a5e; }
    .dot.run { background: var(--leaf); box-shadow: 0 0 6px rgba(79,122,74,0.7); }
    .dot.throwing { background: var(--gold); box-shadow: 0 0 6px rgba(176,125,30,0.7); }
    .dot.fleeing { background: var(--wax); box-shadow: 0 0 6px rgba(168,64,47,0.7); }
    .dot.fled { background: var(--teal); }
    .dot.paused { background: #b07d1e; }

    .tabs-bar { background: #f3ead0; border-bottom: 1px solid var(--line); }
    .tab-btn { color: var(--ink-2); background: transparent; border: 1px solid transparent; }
    .tab-btn:hover { color: var(--ink-1); background: rgba(138,100,32,0.08); }
    .tab-btn.active { background: #5a4426; color: #f9f1da; border-color: transparent; }

    .body { padding: 9px 12px; }
    .row .k { color: var(--ink-2); }
    .row .v { color: var(--ink-1); font-family: var(--num-font); font-variant-numeric: tabular-nums; }
    .row .v.accent { color: var(--gold); }
    .row .v.ok { color: var(--leaf); }
    .row .v.warn { color: #b07d1e; }
    .divider { border-top: 1px dashed var(--line); }

    .enemy-card {
        background: linear-gradient(180deg, #fbf4de, #f5ecd0);
        border: 1px solid var(--card-edge);
        box-shadow: inset 0 0 0 2px rgba(252, 247, 234, 0.6);
    }
    .enemy-card.in-battle { border-color: rgba(168, 64, 47, 0.55); }
    .idle-badge { background: #efe5c8; border: 1px solid var(--line); color: var(--ink-3); }
    .enemy-name { color: var(--ink-1); font-weight: 700; }
    .enemy-name.none { color: var(--ink-3); }
    .enemy-tag { background: #efe5c8; border: 1px solid var(--line); color: var(--ink-2); }
    .enemy-tag.battle { background: var(--wax-soft); border-color: rgba(168,64,47,0.4); color: var(--wax); }
    .hpbar { background: #e7dbba; border: 1px solid var(--line); }
    .hpbar-fill { background: var(--wax); }
    .hpbar-fill.mid { background: #b07d1e; }
    .hpbar-fill.low { background: var(--wax); }
    .hp-num { color: var(--ink-1); font-family: var(--num-font); font-variant-numeric: tabular-nums; }
    .hp-num span { color: var(--ink-3); }

    .chip { background: #f3ead0; border: 1px solid var(--line); color: var(--ink-2); }
    .chip.none { color: var(--ink-3); }
    .game { color: var(--ink-3); }
    .game i { background: #b3a175; }
    .game.on { color: var(--leaf); }
    .game.on i { background: var(--leaf); box-shadow: 0 0 5px rgba(79,122,74,0.6); }

    /* ---------- PVP tab · 绘本化 ---------- */
    .pv-root .pv-status-row { color: var(--ink-2); }
    .pv-root .pv-dot { background: #b3a175; }
    .pv-root .pv-dot.on { background: var(--leaf); box-shadow: 0 0 5px rgba(79,122,74,0.6); }
    .pv-root .pv-dot.off { background: #b3a175; }
    .speed-badge { background: var(--gold-soft); border: 1px solid var(--card-edge); color: var(--gold); font-family: var(--num-font); }
    .pv-engine-btn { background: linear-gradient(135deg, #6d5430, #5a4426); color: #f9f1da; border: none; }
    .pv-engine-btn:hover { background: linear-gradient(135deg, #7a5f38, #6d5430); }
    .pv-engine-btn.stop { background: linear-gradient(135deg, #a8402f, #8c3626); }
    .pv-root .empty-state { color: var(--ink-3); }

    .pv-root .stat-nums { color: var(--ink-1); }
    .pv-root .hp-val { font-family: var(--num-font); }
    .pv-root .bar-track { border: 1px solid var(--line); }
    .pv-root .bar-fill { background: rgba(63, 52, 40, 0.55); }
    .pv-root .sec-title { color: var(--ink-3); letter-spacing: 0.08em; }
    .pv-root .skill-card { background: #f7f0da; border: 1px solid var(--line); }
    .pv-root .skill-card:hover { background: #fdf9ee; border-color: var(--card-edge); }
    .pv-root .skill-card.kill { background: linear-gradient(90deg, rgba(168,64,47,0.14), rgba(176,125,30,0.10)); border-color: rgba(168,64,47,0.5); box-shadow: none; }
    .pv-root .skill-icon { background: #fffdf6; border: 1px solid var(--line); }
    .pv-root .skill-name { color: var(--ink-1); }
    .pv-root .skill-type-tag { background: #efe5c8; color: var(--ink-2); }
    .pv-root .skill-dmg-num { color: var(--teal); }
    .pv-root .skill-dmg-num.kill { color: var(--wax); }
    .pv-root .skill-mult { color: var(--leaf); }
    .kill-tag { background: var(--wax); }
    .pv-root .energy-crystals { color: var(--teal); }

    .pv-root .resonance-box { background: rgba(138, 100, 32, 0.07); border: 1px solid rgba(138, 100, 32, 0.3); }
    .pv-root .resonance-title { color: var(--gold); }
    .pv-root .resonance-inferred { background: #f3ead0; color: var(--ink-2); }
    .pv-root .attr-pill { background: #fffdf6; border: 1px solid var(--line); color: var(--ink-1); }
    .pv-root .res-case-card { background: #f7f0da; border: 1px solid var(--line); }
    .pv-root .res-case-card.lethal { background: rgba(168,64,47,0.12); border-color: rgba(168,64,47,0.45); }
    .pv-root .res-name { color: var(--ink-1); }
    .pv-root .res-tag { background: var(--gold-soft); color: var(--gold); }
    .pv-root .res-tag.warn { background: rgba(176,125,30,0.18); color: #8a6410; }
    .pv-root .res-tag.extreme { background: rgba(168,64,47,0.2); color: var(--wax); }
    .pv-root .res-dmg { color: var(--teal); }
    .pv-root .res-dmg.lethal { color: var(--wax); }
    .pv-root .threat-card { background: rgba(168,64,47,0.06); border: 1px solid rgba(168,64,47,0.2); }
    .pv-root .threat-card.lethal { border-color: rgba(168,64,47,0.5); background: rgba(168,64,47,0.14); }
    .pv-root .threat-name { color: var(--wax); }
    .pv-root .threat-dmg { color: var(--wax); }

    /* 旧版精简窗同步 */

        /* ===== 合并版: 标签页 + PVP 引擎开关 ===== */
        .tabs { display: flex; gap: 4px; margin-left: 2px; }
        .tab-btn {
            border: 1px solid rgba(255,255,255,0.10); background: transparent;
            color: #8b93a7; font-size: 10px; font-family: inherit;
            padding: 3px 9px; border-radius: 999px; cursor: pointer;
            transition: all 0.15s ease;
        }
        .tab-btn.active {
            color: #fff; background: linear-gradient(135deg, #6366f1, #22d3ee);
            border-color: transparent; font-weight: 700;
        }
        .drag-underlay {
            position: absolute; inset: 0; z-index: 0;
        }
        .head { position: relative; }
        .head .tabs, .head .fold-btn, .head .title, .head .dot {
            position: relative; z-index: 1;
        }

        .pv-dot {
            width: 9px; height: 9px; border-radius: 50%;

        }
        .pv-dot.off { background: #555c6e; box-shadow: none; }
        .pv-engine-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .pv-engine-btn {
            border: none; cursor: pointer; border-radius: 8px;
            font-size: 11px; font-weight: 700; font-family: inherit;
            padding: 5px 12px; color: #fff;

        }
        .pv-engine-btn.on { background: linear-gradient(135deg, #ef4444, #b91c1c); }
.pv-root .card:hover {

}

<body>
<div class="card" id="card">
    <div class="head" id="head">
        <span class="dot" id="dot"></span>
        <span class="title" id="title">待机<small id="subtitle"></small></span>
        
        <div class="drag-underlay pywebview-drag-region"></div>
        <div class="tabs">
            <button class="tab-btn active" id="tabAfk" onclick="switchTab('afk')">🎯 挂机</button>
            <button class="tab-btn" id="tabPvp" onclick="switchTab('pvp')">⚔️ PVP</button>
        </div>
        <button class="fold-btn" id="foldBtn" onclick="toggleFold()" title="折叠/展开">▾</button>
    </div>
    <div class="body" id="wBody">
        <div class="row"><span class="k">运行状态</span><span class="v accent" id="wState">停止</span></div>
        <div class="row"><span class="k">实时详情</span><span class="v" id="wDetail" style="font-weight:400;color:#94a3b8;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">—</span></div>
        <div class="divider"></div>

        <!-- 敌方战情卡片 -->
        <div class="enemy-card" id="wEnemyCard">
            <div class="enemy-avatar-box">
                <div class="idle-badge" id="wIdleBadge">🎯</div>
                <img class="enemy-avatar" id="wEnemyAvatar" style="display:none;" src="" alt="" onerror="this.style.display='none'">
            </div>

                    <div class="hp-num" id="wEnemyHpNum">--<span>%</span></div>
                </div>
            </div>
        </div>

        <div class="row"><span class="k">战斗 / 逃跑</span><span class="v ok" id="wBattles">0</span></div>
        <div class="row"><span class="k">丢球 / 捕获</span><span class="v warn" id="wBalls">0 / 0</span></div>
        <div class="divider"></div>

        <div id="pvRoot" style="display:none" class="pv-root">

                <span style="font-size:10px;color:#555c6e;" id="pvEngineHint">需先在主控台 PVP 页确认配置</span>

                </div>

</div>
<script>
    const $ = id => document.getElementById(id);
    let folded = false;
    const W_WIDTH = 340, H_EXPANDED = 350, H_FOLDED = 42;

    const STATE_TXT = {
        stopped: '停止',
        waiting: '巡逻找怪',
        fighting: '战斗中',
        throwing: '丢球中',
        fleeing: '遭遇战斗·逃跑中',
        fled: '已脱离战斗',
        paused: '暂停'
    };

    function getPetAvatar(name) {
        if (!name || name === '?' || name === '未在战斗' || name === '遭遇精灵') return '';
        const map = window.PET_ASSET_MAP;
        if (!map) return '';

        const raw = String(name).trim();
        // 1. 直接精准匹配
        if (map[raw]) return `assets/img/pets/${map[raw]}`;

        // 2. 去除括号形态修饰（如 "白金独角兽（变体形态）" -> "白金独角兽"）
        const clean = raw.replace(/[\(（].*?[\)）]/g, '').trim();
        if (clean && map[clean]) return `assets/img/pets/${map[clean]}`;

        // 3. 数字编号匹配（如 117 或 #117）
        const numMatch = raw.match(/\d+/);
        if (numMatch) {
            const num = parseInt(numMatch[0], 10);
            const pad3 = String(num).padStart(3, '0');
            for (const [k, v] of Object.entries(map)) {
                if (v.startsWith(`${pad3}_`) || v.startsWith(`${num}_`)) {
                    return `assets/img/pets/${v}`;
                }
            }
        }

        // 4. 模糊包含匹配
        for (const [k, v] of Object.entries(map)) {
            if (clean && (k.includes(clean) || clean.includes(k))) {
                return `assets/img/pets/${v}`;
            }
        }

        return '';
    }

    // 按内容真实高度同步窗口尺寸(乘 devicePixelRatio 换算物理像素,修复 DPI 缩放下折叠变形)
    function syncSize() {
        const card = document.getElementById('card');
        if (!card || !window.pywebview || !pywebview.api.widget_resize) return;
        const dpr = window.devicePixelRatio || 1;
        const w = Math.ceil(Math.max(card.offsetWidth, document.body.scrollWidth) * dpr);
        const h = Math.ceil(Math.max(card.offsetHeight, document.body.scrollHeight) * dpr);
        pywebview.api.widget_resize(w, h);
    }

    async function toggleFold() {
        folded = !folded;
        $('wBody').style.display = folded ? 'none' : '';
        $('foldBtn').textContent = folded ? '▴' : '▾';
        try { await pywebview.api.widget_set_folded(folded); } catch (e) {}
        // 等布局完成再量尺寸
        requestAnimationFrame(() => setTimeout(syncSize, 30));
    }

    function setHp(pct) {
        const bar = $('wEnemyHpBar'), num = $('wEnemyHpNum');
        if (pct == null) {
            bar.style.width = '0%';

            num.innerHTML = '--<span>%</span>';
            return;
        }
        const v = Math.max(0, Math.min(100, pct));
        bar.style.width = (100 - v) + '%';
        bar.className = 'hpbar-fill' + (v <= 20 ? ' low' : v <= 50 ? ' mid' : '');
        num.innerHTML = v + '<span>%</span>';
    }

    async function tick() {
        try {
            if (!window.pywebview || !pywebview.api) return;
            const s = await pywebview.api.get_state();
            const e = await pywebview.api.engine_status();

            const isRunning = !!e.running;
            const stateKey = isRunning ? (e.state || 'running') : 'stopped';
            const dot = $('dot');

            let dotClass = 'dot';
            if (isRunning) {
                if (stateKey === 'fleeing') dotClass += ' fleeing';
                else if (stateKey === 'throwing') dotClass += ' throwing';
                else if (stateKey === 'fled') dotClass += ' fled';
                else if (stateKey === 'paused') dotClass += ' paused';
                else dotClass += ' run';
            }
            dot.className = dotClass;

            $('title').childNodes[0].textContent = isRunning ? (STATE_TXT[stateKey] || stateKey) : '待机';
            $('subtitle').textContent = e.dry_run ? ' (模拟)' : '';

            $('wState').textContent = STATE_TXT[stateKey] || stateKey;
            $('wDetail').textContent = e.detail || '—';
            $('wDetail').title = e.detail || '';
            $('wBattles').textContent = e.battles_done ?? 0;
            
            if (e.mode_type === 'tool') {
                $('wBalls').textContent = `${e.catch_attempts ?? 0} 球`;
            } else {
                $('wBalls').textContent = `${e.catch_attempts ?? 0} / ${e.catches ?? 0}`;
            }

            // 敌方战情卡片展示
            const enemyName = e.enemy_name;
            const watching = !!e.watching;  // 观察模式: 引擎没跑也监视到了战斗
            const inBattle = !!(enemyName && enemyName !== '?' && enemyName !== 'None') || watching;
            const enemyCard = $('wEnemyCard');
            const idleBadge = $('wIdleBadge');
            const enemyAvatar = $('wEnemyAvatar');
            const enemyTag = $('wEnemyTag');

            if (inBattle) {
                enemyCard.className = 'enemy-card in-battle';
                $('wEnemyName').className = 'enemy-name';
                $('wEnemyName').textContent = enemyName;
                enemyTag.className = 'enemy-tag battle';
                enemyTag.textContent = stateKey === 'fleeing' ? '遭遇对战' : '战斗中';

                const avatarUrl = getPetAvatar(enemyName);
                if (avatarUrl) {
                    enemyAvatar.src = avatarUrl;
                    enemyAvatar.style.display = 'block';
                    idleBadge.style.display = 'none';
                } else {
                    enemyAvatar.style.display = 'none';
                    idleBadge.textContent = '⚔️';
                    idleBadge.style.display = 'flex';
                }
                setHp(e.enemy_hp != null ? e.enemy_hp : (watching ? 100 : null));
            } else {
                enemyCard.className = 'enemy-card';
                $('wEnemyName').className = 'enemy-name none';
                $('wEnemyName').textContent = watching ? '战斗识别中…'
                    : (isRunning ? (stateKey === 'fled' ? '战斗已脱离' : '巡逻/丢球中') : '未在战斗');
                enemyTag.className = 'enemy-tag';
                enemyTag.textContent = watching ? '观察中' : (isRunning ? '待命中' : '空闲');

                enemyAvatar.style.display = 'none';
                idleBadge.textContent = watching ? '👁' : (isRunning ? (stateKey === 'fled' ? '✨' : '🎯') : '💤');
                idleBadge.style.display = 'flex';
                setHp(null);
            }

            // 任务列表
            const chips = [];
            (s.tasks || []).forEach(t => chips.push(`<span class="chip">${t.name}</span>`));
            $('wChips').innerHTML = chips.length ? chips.join('') : '<span class="chip none">全部空闲</span>';

            // 游戏前台/后台状态
            $('wGame').className = 'game' + (s.game_active ? ' on' : '');
            $('wGame').querySelector('span').textContent = s.game_active ? '游戏窗口前台' : '游戏窗口后台';
        } catch (err) { /* 后端未就绪，静默 */ }
    }

    window.addEventListener('pywebviewready', async () => {
        // 应用上次记住的折叠偏好
        try {
            const st = await pywebview.api.widget_get_state();
            if (st.folded && !folded) await toggleFold();
        } catch (e) {}
        syncSize();  // 初始就按内容真实尺寸校准(修 DPI 缩放偏差)
        tick();
        setInterval(tick, 400);
    });
</script>
<script>
let starfallMode = 'auto';          // 'auto' | 'manual'
let starfallManualStacks = 0;
let _lastStarfallTable = null;      // 缓存最近一次推送的速查表, 供下拉重渲染
let _lastEnemyHp = 0;               // 缓存敌方估算 HP, 供本地重绘致死判定
let _lastPayload = null;            // 缓存最近一次完整推送, 供下拉变更后本地重绘

// 属性映射
const ATTR_MAP = {
    "火": "fire.webp", "水": "water.webp", "草": "grass.webp", "电": "electric.webp", "冰": "ice.webp",
    "虫": "bug.webp", "翼": "flying.webp", "地": "ground.webp", "萌": "fairy.webp", "武": "fighting.webp",
    "毒": "poison.webp", "龙": "dragon.webp", "幽": "ghost.webp", "恶": "dark.webp", "光": "light.webp",
    "普通": "normal.webp", "机械": "steel.webp", "幻": "psychic.webp"
};

function getAttrIcon(attr) {
    if (!attr) return '';
    const clean = String(attr).replace('系', '').trim();
    const file = ATTR_MAP[clean] || ATTR_MAP[clean.toLowerCase()];
    return file ? `assets/img/icons/${file}` : '';
}

function pvGetPetAvatar(name) {
    if (!name) return 'assets/img/icons/normal.webp';
    const map = window.PET_ASSET_MAP;
    if (!map) return 'assets/img/icons/normal.webp';

    const raw = String(name).trim();
    // 1. 直接精准匹配
    if (map[raw]) return `assets/img/pets/${map[raw]}`;

    // 2. 去除括号形态修饰（如 "白金独角兽（变体形态）" -> "白金独角兽"）
    const clean = raw.replace(/[\(（].*?[\)）]/g, '').trim();
    if (clean && map[clean]) return `assets/img/pets/${map[clean]}`;

    // 3. 数字编号匹配（如 117 或 #117）
    const numMatch = raw.match(/\d+/);
    if (numMatch) {
        const num = parseInt(numMatch[0], 10);
        const pad3 = String(num).padStart(3, '0');
        for (const [k, v] of Object.entries(map)) {
            if (v.startsWith(`${pad3}_`) || v.startsWith(`${num}_`)) {
                return `assets/img/pets/${v}`;
            }
        }
    }

    // 4. 模糊包含匹配
    for (const [k, v] of Object.entries(map)) {
        if (clean && (k.includes(clean) || clean.includes(k))) {
            return `assets/img/pets/${v}`;
        }
    }

    return 'assets/img/icons/normal.webp';
}

function getSkillIcon(name) {
    if (!name) return '';
    return `assets/img/skills/${encodeURIComponent(name.trim())}.webp`;
}

// ===== AI 陪玩弹幕条 (由主程序 /comment 端点推送) =====
let _aiChatLines = [];
// 按主程序推送的 state 开关 AI 对话框
window.onStateUpdate = window.onStateUpdate || function(st) {
    const box = document.getElementById('aiChat');
    if (!box) return;
    const show = st && st.companion_enabled;
    box.style.display = show ? '' : 'none';
};
function pushAiComment(text, mood) {
    mood = mood || 'normal';
    _aiChatLines.push({ text: String(text || '').slice(0, 120), mood: String(mood), ts: Date.now() });
    if (_aiChatLines.length > 3) _aiChatLines = _aiChatLines.slice(-3);
    renderAiChat();
}
function renderAiChat() {
    const box = document.getElementById('aiChat');
    if (!box) return;
    if (!_aiChatLines.length) {
        box.innerHTML = '<div class="ai-empty">💬 AI 伙伴待命中…</div>';
        return;
    }
    const TAGS = { hype: '🔥', care: '💚', salt: '🌶', normal: '✨' };
    box.innerHTML = _aiChatLines.map(l => {
        const tag = TAGS[l.mood] || '✨';
        return '<div class="ai-line mood-' + l.mood + '">'
            + '<span class="ai-tag">' + tag + ' AI</span>'
            + '<span>' + l.text + '</span></div>';
    }).join('');
}
function onStarfallSelect(value) {
    starfallMode = 'manual';
    starfallManualStacks = parseInt(value, 10) || 1;
    // 用缓存数据本地重绘(不等待下一次 500ms 推送), 反馈立即生效
    if (_lastPayload) updatePVPData(_lastPayload);
}

function _ensurePvContainers(bodyEl) {
    // 骨架常显: 保证 #pvCompact / #pvDetail 容器存在(卡片常显原则)
    if (!document.getElementById('pvCompact')) {
        bodyEl.insertAdjacentHTML('afterbegin',
            '<div id="pvCompact"></div>' +
            '<div class="pv-detail-fold" id="pvDetail">' +
            '<button class="pv-detail-head" id="pvDetailBtn" onclick="togglePvpDetail()">📌 推演详情（星陨/愿力/AI详析/威胁） ▸</button>' +
            '<div id="pvDetailBody" style="display:none"></div></div>');
    }
}

function togglePvpDetail() {
    _pvDetailOpen = !_pvDetailOpen;
    const body = document.getElementById('pvDetailBody');
    const btn = document.getElementById('pvDetailBtn');
    if (!body) return;
    body.style.display = _pvDetailOpen ? '' : 'none';
    if (btn) btn.textContent = _pvDetailOpen
        ? '📌 收起推演详情 ▾'
        : '📌 推演详情（星陨/愿力/AI详析/威胁） ▸';
    // 折叠期间数据来过 → 展开时补画一次
    if (_pvDetailOpen && _pvDetailDirty && _lastPayload) {
        updatePVPData(_lastPayload);
        return;   // updatePVPData 内部已渲染详情
    }
    if (typeof syncSize === 'function') setTimeout(syncSize, 50);
    else if (typeof syncPvpSize === 'function') setTimeout(syncSize, 50);
}

function updatePVPData(data) {
    // 内容高度随数据变化,渲染后自动校准窗口尺寸
    requestAnimationFrame(() => setTimeout(syncSize, 50));
    const statusDot = document.getElementById('statusDot');

    if (sfSelect && (document.activeElement === sfSelect || sfSelect._open)) {
        setTimeout(() => updatePVPData(data), 400);

        if (sd !== undefined && sd !== null) {

    // 我方技能伤害推演

            </div>

            <div class="vs-divider">
                <div class="vs-tag">VS</div>
            </div>

            <div class="pet-side enemy">
                <div class="pet-header">
                    <img class="pet-avatar" src="${enemyAvatar}" onerror="this.src='assets/img/icons/normal.webp'">
                    <div class="pet-info">
                        <div class="pet-name">${e.name || '敌方精灵'}</div>
                        <div class="pet-attrs">${enemyAttrIcons || '<span style="font-size:9.5px;color:var(--dim)">常规</span>'}</div>
                    </div>
                </div>
                <div class="stat-bar-box">
                    <div class="stat-nums">
                        <span class="hp-val">${enemyHpPct}%</span>
                        <span style="color:var(--dim)">HP</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${100 - enemyHpPct}%"></div>
                    </div>
                </div>
                <div class="energy-row" style="justify-content: flex-end;">
                    <span>目标</span>
                    <span style="color: #f87171; font-weight:700;">锁定中</span>
                </div>
            </div>
        </div>`;

    // AI 战术建议解析
    const rawAdvice = data.ai_advice;
    let advice = { actionLabel: '分析中…', reasoning: '', risk: '', confidence: 'medium', altsHtml: '' };
    if (rawAdvice && rawAdvice.recommendation) {
        const r = rawAdvice.recommendation;
        const actionMap = { 'skill': '⚔️ 出招', 'switch': '🔄 换宠', 'energize': '⚡ 聚能', 'resonance': '🔮 愿力冲击' };
        const actionIcon = actionMap[r.action] || ('➡️ ' + r.action);
        const targetHtml = r.target ? `<span class="ai-d-target">${r.target}</span>` : '';
        advice = {
            actionLabel: `${actionIcon} ${targetHtml}`,
            reasoning: r.reasoning || '',
            risk: r.risk || '',
            confidence: r.confidence || 'medium',
            altsHtml: ''
        };
        if (rawAdvice.alternatives && rawAdvice.alternatives.length) {
            advice.altsHtml = rawAdvice.alternatives.map(a =>
                ` <span style="font-size:9px;color:var(--dim);display:block;padding:1px 0;">↳ ${a.action}: ${a.target} — ${(a.reasoning || '').slice(0, 40)}</span>`
            ).join('');
        }
    } else if (!rawAdvice) {
        advice = { actionLabel: '等待推演…', reasoning: '', risk: '', confidence: 'medium', altsHtml: '' };
    } else if (rawAdvice.error) {
        advice = { actionLabel: '推演异常', reasoning: rawAdvice.error, risk: '', confidence: 'low', altsHtml: '' };
    }

    // ===== 信息架构: 紧凑对局卡常显, 推演详情折叠 =====
    // 常显(每帧刷新): VS看板 / AI建议一行 / 我方技能4卡 / 敌方上招与致死预警
    // 折叠(展开时才刷新): 星陨速查 / 愿力推演 / AI完整理由 / 敌方威胁全表
    const enemyCast = (data.enemy_last_cast || '').toString().trim();
    const lethalThreat = (data.enemy_threats || []).find(t => t.is_lethal);
    const lethalHtml = lethalThreat
        ? `<div class="enemy-cast-line lethal">⚠️ 致死预警: <b>${lethalThreat.name}</b> ${lethalThreat.dmg_min}~${lethalThreat.dmg_max}</div>`
        : '';

    const compactHtml = `
        ${vsBannerHtml}
        <div class="adv-compact">
            <span class="ai-d-action" style="padding:0;font-size:13px;">${advice.actionLabel}</span>
            <span class="adv-conf ai-d-conf ${advice.confidence || 'medium'}">${(advice.confidence === 'high' ? '高' : advice.confidence === 'low' ? '低' : '中')}</span>
            ${advice.reasoning ? `<div class="adv-reason">${advice.reasoning.slice(0, 64)}${advice.reasoning.length > 64 ? '…' : ''}</div>` : ''}
        </div>
        <div class="sec-title">🎯 我方技能即时伤害推演</div>
        <div class="skills-grid">
            ${skillsHtml || '<div style="color:var(--dim);font-size:11px;padding:8px 0;text-align:center;">暂无技能推演数据</div>'}
        </div>
        ${enemyCast ? `<div class="enemy-cast-line">🗡️ 敌方上招: <b>${enemyCast}</b></div>` : ''}
        ${lethalHtml}
    `;

    const detailHtml = `
        ${starfallHtml || '<div class="pv-detail-empty">星陨数据等待推送…</div>'}
        ${resonanceHtml || ''}
        <div class="ai-decision-box" id="aiDecisionBox">
            <div class="ai-d-head">
                <span class="ai-d-title">🧠 AI 战术建议 · 完整分析</span>
                <span class="ai-d-conf ${advice.confidence || 'medium'}">${(advice.confidence === 'high' ? '高' : advice.confidence === 'low' ? '低' : '中') || '中'}</span>
            </div>
            <div class="ai-d-reason">${advice.reasoning || '（暂无完整理由）'}</div>
            ${advice.risk ? `<div class="ai-d-risk">⚠️ ${advice.risk}</div>` : ''}
            ${advice.altsHtml ? `<div class="ai-d-alts">备选方案:${advice.altsHtml}</div>` : ''}
        </div>
        <div class="sec-title">🎯 敌方预测伤害 (按其种族高项筛选)</div>
        ${threatsHtml || '<div class="pv-detail-empty">暂无威胁数据</div>'}
    `;

    _ensurePvContainers(bodyEl);
    const compactEl = document.getElementById('pvCompact');
    if (compactEl) compactEl.innerHTML = compactHtml;

    // 详情区: 折叠时只标脏不渲染(省 80% 重排), 展开瞬间补画一次
    const detailBody = document.getElementById('pvDetailBody');
    if (detailBody) {
        if (_pvDetailOpen) {
            detailBody.innerHTML = detailHtml;
            _pvDetailDirty = false;
        } else {
            _pvDetailDirty = true;
        }
    }

    // 下拉展开期标记(mousedown→change 之间), 配合 updatePVPData 开头的跳过逻辑防打断
    const newSelect = document.getElementById('starfallStacksSelect');
    if (newSelect) {
        newSelect.addEventListener('mousedown', () => { newSelect._open = true; });
        newSelect.addEventListener('blur', () => { newSelect._open = false; });
    }
}

    // ===== 合并版: 标签切换(纯手动, 不随战斗状态自动切) =====
    let activeTab = 'afk';
    function switchTab(tab) {
        activeTab = tab;
        $('wBody').style.display = tab === 'afk' ? '' : 'none';
        $('pvRoot').style.display = tab === 'pvp' ? '' : 'none';
        $('tabAfk').classList.toggle('active', tab === 'afk');
        $('tabPvp').classList.toggle('active', tab === 'pvp');
        requestAnimationFrame(() => setTimeout(syncSize, 30));
    }

    // ===== PVP 识别引擎开关(悬浮窗直达) =====
    let pvEngineOn = false;
    let pvLastSource = '';          // 上次数据源(状态轮询时记录, 启动时带回)
    async function pvEngineToggle() {
        try {
            if (pvEngineOn) await pywebview.api.pvp_engine_stop();
            else await pywebview.api.pvp_engine_start(pvLastSource);
        } catch (e) {}
        refreshPvEngine();
    }
    async function refreshPvEngine() {
        if (!window.pywebview || !pywebview.api.pvp_engine_status) return;
        try {
            const s = await pywebview.api.pvp_engine_status();
            pvEngineOn = !!s.running;
            if (s.source) pvLastSource = s.source;   // 记住引擎/上次的源, 启动时带回
            const btn = $('pvEngineBtn');
            if (btn) {
                btn.textContent = pvEngineOn ? '■ 停止识别' : '▶ 启动识别';
                btn.classList.toggle('on', pvEngineOn);
            }
        } catch (e) {}
    }
    setInterval(refreshPvEngine, 2000);

    // ===== 自研拖拽: 标题条按下拖动,不依赖 pywebview 拖拽区/窗口焦点 =====
    (function initDrag() {
        let dragging = false, lx = 0, ly = 0, px = 0, py = 0, raf = 0;
        function bind() {
            const el = document.querySelector('.drag-underlay');
            if (!el) { setTimeout(bind, 300); return; }
            el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                dragging = true;
                lx = e.screenX; ly = e.screenY; px = py = 0;
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                px += e.screenX - lx; py += e.screenY - ly;
                lx = e.screenX; ly = e.screenY;
                if (!raf) raf = requestAnimationFrame(flush);
            });
            window.addEventListener('mouseup', () => {
                if (dragging) { flush(); dragging = false; }
            });
        }
        function flush() {
            raf = 0;
            if ((px || py) && window.pywebview && pywebview.api.move_window_by) {
                pywebview.api.move_window_by(Math.round(px), Math.round(py));
                px = py = 0;
            }
        }
        bind();
    })();
</script>
</body>
</html>
