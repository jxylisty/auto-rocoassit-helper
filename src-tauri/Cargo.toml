[package]
name = "lkwg-pvp-assistant"
version = "2.0.0"
description = "洛克王国 PVP 助手桌面客户端"
authors = ["jxylisty"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
